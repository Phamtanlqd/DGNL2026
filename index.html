<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Hệ thống thi ĐGNL Đa Môn</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6fa; }
    .nav { background: #fff; border-bottom: 1px solid #dfe3ec; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
    .nav select { font-weight: bold; padding: 6px 12px; border-radius: 6px; border: 1px solid #1d4ed8; color: #1d4ed8; }
    .c { background: #fff; border: 1px solid #dfe3ec; border-radius: 12px; padding: 16px; margin: 16px auto; max-width: 1000px; }
    button { cursor: pointer; padding: 6px 12px; border-radius: 6px; border: 1px solid #dfe3ec; background: #fff; }
    button.p { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  </style>
</head>
<body>

<div class="nav">
  <b>🎯 Hệ thống thi ĐGNL</b>
  <label style="margin-left:auto">Môn đang chọn: 
    <select id="subSel" onchange="switchSubject(this.value)">
      <option value="Toan">Toán học</option>
      <option value="Van">Ngữ văn</option>
      <option value="Anh">Tiếng Anh</option>
      <option value="Ly">Vật lý</option>
      <option value="Hoa">Hóa học</option>
    </select>
  </label>
</div>

<div class="c" id="mainApp">
  <h2>Đang tải dữ liệu môn học...</h2>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz7u3EOWEBxTTsNipd3613Nk0m8WXyg0mYznDQUmgGxwSrN7lMW8nC8Ef1Cw6VihdzyoA/exec';
let currentSubject = 'Toan';

function switchSubject(sub) {
  currentSubject = sub;
  document.getElementById('mainApp').innerHTML = `
    <h3>Đã chuyển sang môn: <span style="color:#1d4ed8">${sub}</span></h3>
    <p>Ngân hàng câu hỏi, mã đề và kết quả thi sẽ được cập nhật riêng biệt cho môn này.</p>
  `;
}

// Khởi tạo ban đầu
switchSubject('Toan');
</script>
</body>
</html>
