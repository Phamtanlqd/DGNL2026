function login(){const c=D.cfg;$('#app').innerHTML=`<div class="c" style="max-width:460px;margin:30px auto"><h2>${API_URL?'Phòng thi trực tuyến':esc(c.name)}</h2>${API_URL?'':`<p class="mu">Môn ${esc(c.mon)} · ${c.min} phút</p>`}${(API_URL||c.codes.length)?`<label class="sm">Số báo danh<br><input id="sb" placeholder="VD: 10001" style="width:100%"></label><p><button class="p" onclick="enter()">Vào phòng thi</button></p><p class="sm mu">Thử với SBD 10001 đến 10005. Trong lúc thi, rời tab hoặc chuyển cửa sổ sẽ bị ghi nhận vi phạm.</p>`:'<div class="al">Chưa có mã đề. Quản trị viên cần sinh mã đề trước.</div>'}</div>`}
function enterLocal(sbd){const r=rows().find(x=>x.sbd===sbd);if(!r){alert('SBD không có trong danh sách.');return}
 const idx=rows().indexOf(r);let s=D.subs[sbd];if(s&&s.done){S=s;S.sbd=sbd;return result()}
 if(!s){s=D.subs[sbd]={code:D.cfg.codes[idx%D.cfg.codes.length].code,ans:{},flag:{},viol:0,start:Date.now(),done:false,qi:0}}
 S=s;S.sbd=sbd;S.name=r.ten;save();exam()}
function exam(){const cd=cdOf(),q=cd.qs[S.qi],a=S.ans[S.qi];let b='';
 if(q.type==='mc')b=q.ov.map((o,k)=>`<button class="o ${a===k?'on':''}" onclick="ans(${k})"><b>${'ABCD'[k]}.</b> ${ER(o)}</button>`).join('');
 if(q.type==='tf')b=q.sv.map((o,k)=>`<div class="tr"><span><b>${'abcd'[k]})</b> ${ER(o)}</span><button class="${a&&a[k]===true?'on':''}" onclick="tf(${k},true)">Đúng</button><button class="${a&&a[k]===false?'on':''}" onclick="tf(${k},false)">Sai</button></div>`).join('');
 if(q.type==='sa')b=`<input value="${esc(a||'')}" placeholder="Nhập đáp án" oninput="ans(this.value,1)" style="width:100%;max-width:300px">`;
 if(q.type==='essay')b=`<textarea style="min-height:160px" oninput="ans(this.value,1)" placeholder="Trình bày bài làm...">${esc(a||'')}</textarea>`;
 const pl=cd.qs.map((x,i)=>{const v=S.ans[i],d=Array.isArray(v)?v.some(z=>z!=null):(v!==undefined&&v!=='');return `<button class="${d?'d':''} ${S.flag[i]?'f':''} ${i===S.qi?'u':''}" onclick="S.qi=${i};save();exam()">${i+1}</button>`}).join('');
 $('#app').innerHTML=`<div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>${esc(S.title||D.cfg.name)}</b> · Mã ${S.code}<div class="sm mu">${esc(S.name)} · SBD ${esc(S.sbd)}</div></div><div id="tm">--:--</div><button class="p" onclick="submit()">Nộp bài</button></div>
 ${S.viol?`<div class="al sm">Đã ghi nhận ${S.viol} lần rời khỏi màn hình thi.</div>`:''}
 <div class="ex"><div class="c">${q.pass?`<div class="al sm" style="white-space:pre-wrap;background:var(--bg);color:var(--tx)">${ER(q.pass)}</div>`:''}<div class="sm mu">Câu ${S.qi+1}/${cd.qs.length} <span class="bd">${TY[q.type]}</span> ${q.level?`<span class="bd">${LV[q.level]}</span>`:''}</div><p style="white-space:pre-wrap">${ER(q.stem)}</p>${b}
 <p><button onclick="S.qi=Math.max(0,S.qi-1);save();exam()">← Trước</button> <button onclick="S.flag[S.qi]=!S.flag[S.qi];save();exam()">${S.flag[S.qi]?'Bỏ đánh dấu':'⚑ Đánh dấu'}</button> <button onclick="S.qi=Math.min(${cd.qs.length-1},S.qi+1);save();exam()">Sau →</button></p></div>
 <div class="c"><b class="sm">Bảng câu hỏi</b><div class="pl" style="margin-top:8px">${pl}</div><p class="sm mu">Xanh: đã làm · Vàng: xem lại. Bài được lưu tự động.</p></div></div>`;
 clearInterval(T);T=setInterval(tick,500);tick()}
function ans(v,keep){S.ans[S.qi]=v;save();if(!keep)exam()}
function tf(k,v){const a=(S.ans[S.qi]||[null,null,null,null]).slice();a[k]=v;S.ans[S.qi]=a;save();exam()}
function tick(){const r=Math.max(0,Math.round(((S.endAt||S.start+D.cfg.min*60000)-(Date.now()+(S.off||0)))/1000)),e=$('#tm');if(e){e.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')}if(r<=0&&!S.fin)fin()}
function submit(){const n=cdOf().qs.filter((q,i)=>{const v=S.ans[i];return !(Array.isArray(v)?v.some(z=>z!=null):(v!==undefined&&v!==''))}).length;if(confirm('Nộp bài?'+(n?`\nCòn ${n} câu chưa làm.`:'')))fin()}
async function fin(){if(S.fin)return;S.fin=1;clearInterval(T);
 if(API_URL){const r=await api('submit',{sbd:S.sbd,token:S.token,ans:S.ans,viol:S.viol});if(!r.ok){S.fin=0;alert(r.err+'\nHãy kiểm tra mạng rồi bấm Nộp bài lại.');return}S.g=r.g}
 S.done=true;S.end=Date.now();if(!API_URL)save();result()}
function result(){const g=S.g||grade(S.code,S.ans);$('#app').innerHTML=`<div class="c" style="max-width:520px;margin:30px auto;text-align:center"><h2>Bài làm đã được nộp</h2><p class="mu">${esc(S.sbd)} · Mã đề ${S.code}</p><div style="font-size:2.4rem;font-weight:800;color:var(--pr)">${g.p.toFixed(2)}<span class="mu" style="font-size:1rem"> /10</span></div><p class="sm">Điểm phần trắc nghiệm, đúng/sai, trả lời ngắn: ${(+g.s.toFixed(2))}/${g.mx}${g.es?`. Có ${g.es} câu tự luận chờ giáo viên chấm.`:''}</p><button onclick="S=null;login()">Thoát</button></div>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.done&&mode==='hs'){S.viol++;save()}});
function mj(){if(window.renderMathInElement)renderMathInElement($('#app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
let _mt;new MutationObserver(()=>{clearTimeout(_mt);_mt=setTimeout(mj,40)}).observe($('#app'),{childList:true,subtree:true});window.addEventListener('load',mj);
if(/[?&](thi|cham)/.test(location.search)){mode=/[?&]cham/.test(location.search)?'gv':'hs';['#r1','#r2','#r3'].forEach(x=>$(x).style.display='none')}
show();
</script></body></html>
