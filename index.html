<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống thi ĐGNL Đa Môn - Bảo mật tuyệt đối</title>
<style>
:root{--bg:#f5f6fa;--cd:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--pr:#1d4ed8;--ps:#e3ebff;--ok:#12805c;--er:#c0392b;--wa:#b7791f;--ws:#fdf0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--cd:#18202f;--tx:#e8ecf5;--mu:#9aa5ba;--bd:#2b3549;--pr:#6e9bff;--ps:#1d2c52;--ok:#4fd1a1;--er:#ff8b7b;--wa:#f0b955;--ws:#473410;color-scheme:dark}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav b{flex:1;min-width:140px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:.85rem}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:9px;padding:7px 12px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.on{background:var(--ps);border-color:var(--pr)}button:disabled{opacity:.5}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
textarea{width:100%;min-height:80px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}.tw table{font-size:.88rem}th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bd{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--ps);color:var(--pr)}.bd.w{background:var(--ws);color:var(--wa)}
.ex{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}@media(max-width:800px){.ex{grid-template-columns:1fr}}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pl button{padding:6px 0}.pl .d{background:var(--ps);border-color:var(--pr)}.pl .f{background:var(--ws);border-color:var(--wa)}.pl .u{outline:2px solid var(--pr)}
.tr{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);padding:7px 0}.tr span{flex:1}
pre{white-space:pre-wrap;margin:0;font:inherit}
#tm{font:700 1.2rem ui-monospace,monospace;padding:3px 10px;border-radius:99px;background:var(--ps);color:var(--pr)}
.al{background:var(--ws);color:var(--wa);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sub-bar{background:var(--ps);padding:6px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fx{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:10px 0 0;background:var(--bg)}
.fxt,.fxb{display:flex;gap:5px;flex-wrap:wrap}.fxt{margin-bottom:6px}.fxt button{padding:4px 10px;font-size:.85rem}.fxb button{min-width:38px;padding:4px 8px}
.pv{border:1px dashed var(--bd);border-radius:8px;padding:8px 10px;min-height:44px;white-space:pre-wrap;margin:4px 0 10px}.pv:empty::before{content:"Công thức sẽ hiện ở đây khi em gõ";color:var(--mu)}
.pp{border-top:1px solid var(--bd);margin-top:12px;padding-top:10px}.pw{white-space:pre-wrap}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tb{position:relative}.tb img{height:96px;border:1px solid var(--bd);border-radius:6px;cursor:zoom-in;background:#fff;display:block;min-width:60px}.tb button{position:absolute;top:2px;right:2px;padding:0 6px;border-radius:99px;line-height:1.4}
.fbtn{display:inline-block;cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:9px;padding:7px 12px}.fbtn.p{background:var(--pr);border-color:var(--pr);color:#fff}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.mdc{background:var(--cd);border-radius:12px;padding:16px;width:min(680px,100%)}
.bar{display:inline-block;width:110px;height:8px;background:var(--bd);border-radius:9px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
h3{font-size:.98rem;margin:14px 0 6px}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/mhchem.min.js"></script>
</head><body>
<div class="nav">
  <b>🎯 Hệ thống thi ĐGNL Đa Môn</b>
  <span id="subSelectorBox" class="sm">Môn: 
    <select id="globalSub" onchange="changeSubject(this.value)">
      <option value="Toan">Toán học</option>
      <option value="Van">Ngữ văn</option>
      <option value="Anh">Tiếng Anh</option>
      <option value="Ly">Vật lý</option>
      <option value="Hoa">Hóa học</option>
      <option value="Sinh">Sinh học</option>
    </select>
  </span>
  <button id="r1" onclick="setRole('ad')">Quản trị</button>
  <button id="r2" onclick="setRole('hs')">Thí sinh</button>
  <button id="r3" onclick="setRole('gv')">Giám khảo</button>
</div>
<div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbz7u3EOWEBxTTsNipd3613Nk0m8WXyg0mYznDQUmgGxwSrN7lMW8nC8Ef1Cw6VihdzyoA/exec';
const LV={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng',VDC:'VD cao'},TY={mc:'Nhiều lựa chọn',tf:'Đúng/Sai',sa:'Trả lời ngắn',essay:'Tự luận'};
const ER=s=>esc(s).replace(/⟪IMG:(\w+)⟫/g,(m,id)=>D.imgs&&D.imgs[id]?`<img src="${D.imgs[id]}" style="max-width:100%;max-height:160px;display:block;margin:6px 0;vertical-align:middle">`:'[hình]');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLE=[
{type:'mc',level:'NB',tag:'Hàm số',stem:'Giá trị nhỏ nhất của $f(x)=x^2-4x+3$ là',opt:{A:'−1',B:'0',C:'1',D:'3'},ans:['A'],sol:'f(x)=(x−2)²−1.'},
{type:'tf',level:'TH',tag:'Hàm số',stem:'Cho $f(x)=x^3-3x$.',st:[{k:'a',t:'$f\'(x)=3x^2-3$.',lv:'NB',ok:true},{k:'b',t:'Hàm số đồng biến trên ℝ.',lv:'TH',ok:false},{k:'c',t:'Cực đại tại $x=-1$.',lv:'TH',ok:true},{k:'d',t:'$f(2)=3$.',lv:'VD',ok:false}],sol:''},
{type:'sa',level:'VD',tag:'Đại số',stem:'Tích các nghiệm của $x^2-7x+10=0$ là',ans:['10'],sol:'Viète.'},
{type:'essay',level:'VD',tag:'Xác suất',stem:'Trình bày suy luận giải bài toán xác suất toàn phần...',sol:'Rubric: lập sơ đồ 0,5; công thức 1,0; kết quả 0,5.'}
];
const ROSTER='10001,Nguyễn Văn An,12A1,0101,123456\n10002,Trần Thị Bình,12A1,0102,123456\n10003,Lê Minh Châu,12A2,0103,123456';

let currentSub = 'Toan';
let D = loadSub(currentSub);

function init(sub){return{bank:SAMPLE.map((q,i)=>({...q,no:i+1})),cfg:{name:'Kỳ thi thử '+sub,mon:sub,min:30,n:4,codes:[],emax:2,thr:1},roster:ROSTER,subs:{},gr:[],grades:{},imgs:{}}}
function loadSub(sub){
  try{const d=JSON.parse(localStorage.getItem('dgnl_sub_'+sub));if(d&&d.bank)return d}catch(e){}
  return init(sub);
}
function save(){
  try{localStorage.setItem('dgnl_sub_'+currentSub,JSON.stringify(D))}catch(e){alert('Bộ nhớ trình duyệt đầy.')}
  push();
}

function changeSubject(sub){
  currentSub = sub;
  D = loadSub(sub);
  D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
  const sel = $('#globalSub'); if(sel) sel.value = sub;
  show();
}

D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
let OV=[],ONL=false,GV=null,S=null,T=null,tab='bank',mode='ad',adminAuthed=false;

async function api(a,p){
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,subject:currentSub,...p})});
    const t=await r.text();
    try{return JSON.parse(t)}catch(e){return{ok:false,err:'Lỗi kết nối máy chủ'}}
  }catch(e){return{ok:false,err:'Không kết nối mạng'}}
}

function AK(){
  return sessionStorage.getItem('ak') || '';
}

async function adminLogin(){
  const pass=$('#adPass').value.trim();
  if(!pass){alert('Vui lòng nhập mật khẩu quản trị!');return;}
  const r=await api('admin_login',{key:pass});
  if(r.ok){
    sessionStorage.setItem('ak',pass);
    adminAuthed=true;
    show();
  }else{
    alert(r.err||'Mật khẩu Quản trị không chính xác');
  }
}

async function pub(){
  if(!D.cfg.codes.length){alert('Chưa sinh mã đề.');return}
  const codes=D.cfg.codes.map(c=>({...c,qs:c.qs.map(normKey)}));
  const used=new Set([...JSON.stringify(codes).matchAll(/⟪IMG:(\w+)⟫/g)].map(m=>m[1])),imgs={};used.forEach(id=>{if(D.imgs[id]) imgs[id]=D.imgs[id]});
  const r=await api('publish',{key:AK(),cfg:D.cfg,codes,roster:D.roster,gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr,fb:D.cfg.fb||'off'},imgs});
  alert(r.ok?`Đăng thành công môn ${currentSub} (${r.n} mã đề, ${r.hs} thí sinh)!`:r.err);
}

async function refresh(){
  const r=await api('stats',{key:AK()});
  if(!r.ok){alert(r.err);return}
  D.subs=r.subs;if(r.fb)D.cfg.fb=r.fb;
  if(r.gr) D.gr = r.gr;
  show();
}
function go2(t){tab=t;if(t==='gs'&&API_URL)refresh();else if(t==='gc')gcLoad();else show()}

let _t;
function push(){if(!API_URL||!S||S.done||mode!=='hs')return;clearTimeout(_t);_t=setTimeout(()=>{if(!S||S.done)return;api('save',{sbd:S.sbd,subject:currentSub,token:S.token,ans:S.ans,viol:S.viol,qi:S.qi}).then(r=>{if(r&&r.files&&S&&JSON.stringify(r.files)!==JSON.stringify(S.files||{})){S.files=r.files;paperRefresh(S.qi)}})},2500)}

async function enter(){
  const sbd=$('#sb').value.trim(), pass=$('#sp').value.trim();
  if(!sbd) return;
  const r=await api('login',{sbd,pass,subject:currentSub});
  if(!r.ok){alert(r.err);return}
  D.imgs=Object.assign(D.imgs||{},r.imgs||{});
  S={sbd,name:r.name,code:r.code,cd:r.cd,ans:r.ans||{},flag:{},viol:r.viol||0,start:r.start,endAt:r.endAt,off:r.now-Date.now(),done:r.done,qi:r.qi||0,token:r.token,g:r.g,title:r.title,files:r.files||{}};
  S.done?result():exam();
}

const cls=t=>String(t||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
function fin3(a,b,c,t){if(c!=null)return{f:c,st:'Vòng 3'};if(a==null||b==null)return{f:null,st:'Chờ chấm'};return Math.abs(a-b)>t?{f:null,st:'Lệch > '+t}:{f:(a+b)/2,st:'Đạt'}}
const gsc=(sbd,no,rd)=>{const x=D.grades[sbd+'|'+no+'|'+rd];return x?x.score:null};
const rpcG=async(a,p)=>api(a,p);

async function gcLoad(){
  const r = await api('stats', {key: AK()});
  if(!r.ok){alert(r.err);return;}
  D.gr = r.gr || [];
  D.cfg.emax = r.emax ?? D.cfg.emax;
  D.cfg.thr = r.thr ?? D.cfg.thr;
  if(r.fb) D.cfg.fb = r.fb;
  OV = (await rpcG('g_over', {key: AK()})).rows || [];
  show();
}

async function setV3(sbd,no,v){const r=await rpcG('g_final',{key:AK(),sbd,no,score:+v});if(!r.ok)alert(r.err);gcLoad()}
async function gcfgSave(){
  const r=await api('g_cfg',{key:AK(),gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr,fb:D.cfg.fb||'off'}});
  alert(r.ok?'Lưu cấu hình chấm thành công.':r.err);
}

function gcTab(){
 const c=D.cfg,n3=OV.filter(o=>/^Lệch/.test(o.st)).length,v=OV.filter(o=>ONL?/^Lệch|^Vòng 3/.test(o.st):true);
 return `<div class="c"><h2>Cấu hình chấm tự luận môn ${currentSub}</h2>
 <div class="g">
   <label class="sm">Điểm tối đa mỗi câu<br><input type="number" step="0.25" value="${c.emax}" onchange="D.cfg.emax=+this.value;save()"></label>
   <label class="sm">Ngưỡng lệch cần vòng 3<br><input type="number" step="0.25" value="${c.thr}" onchange="D.cfg.thr=+this.value;save()"></label>
 </div>
 <div class="tw" style="margin-top:10px"><table><tr><th>Họ tên Giám khảo</th><th>Tài khoản</th><th>Mật khẩu / PIN</th><th>Vòng</th><th>Lớp phụ trách</th><th></th></tr>
 ${D.gr.map((g,i)=>`<tr>
   <td><input value="${esc(g.name)}" onchange="D.gr[${i}].name=this.value;save()"></td>
   <td><input value="${esc(g.user||g.name)}" onchange="D.gr[${i}].user=this.value;save()"></td>
   <td><input type="password" size="10" value="${esc(g.pin)}" onchange="D.gr[${i}].pin=this.value;save()"></td>
   <td><select onchange="D.gr[${i}].round=+this.value;save();show()"><option ${g.round==1?'selected':''}>1</option><option ${g.round==2?'selected':''}>2</option></select></td>
   <td><input value="${esc(g.classes)}" placeholder="12A1,12A2" onchange="D.gr[${i}].classes=this.value;save();show()"></td>
   <td><button onclick="D.gr.splice(${i},1);save();show()">Xóa</button></td>
 </tr>`).join('')}</table></div>
 <p><button onclick="D.gr.push({name:'',user:'',pin:String(Math.floor(1000+Math.random()*9000)),round:1,classes:''});save();show()">+ Thêm giám khảo</button> ${API_URL?'<button class="p" onclick="gcfgSave()">Lưu cấu hình chấm</button>':''}</p>
 </div>
 <div class="c"><h2>Tổng hợp hai vòng chấm (Môn ${currentSub})</h2>
 <p><button onclick="gcLoad()">Làm mới bảng chấm</button> <label class="sm"><input type="checkbox" ${ONL?'checked':''} onchange="ONL=this.checked;show()"> Chỉ hiện bài lệch/vòng 3</label> <span class="bd w">${n3} câu cần vòng 3</span></p>
 <div class="tw"><table><tr><th>Lớp</th><th>SBD · Họ tên</th><th>Câu</th><th>Vòng 1</th><th>Vòng 2</th><th>Lệch</th><th>Vòng 3</th><th>Điểm câu</th><th>Trạng thái</th></tr>
 ${v.map(o=>`<tr><td>${esc(o.lop)}</td><td>${esc(o.sbd)} · ${esc(o.name)}</td><td>${o.no}</td><td>${o.v1??''}</td><td>${o.v2??''}</td><td>${o.v1!=null&&o.v2!=null?Math.abs(o.v1-o.v2).toFixed(2):''}</td><td><input type="number" step="0.25" style="width:70px" value="${o.v3??''}" onchange="setV3('${esc(o.sbd)}',${o.no},this.value)"></td><td>${o.f!=null?+o.f.toFixed(2):''}</td><td>${esc(o.st)}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Chưa có bài tự luận nào cần tổng hợp.</td></tr>'}
 </table></div></div>`;
}

function gvView(){
  GV?gvMain():$('#app').innerHTML=`
    <div class="c" style="max-width:420px;margin:30px auto">
      <h2>Giám khảo chấm tự luận môn ${currentSub}</h2>
      <label class="sm">Tài khoản / Mã giám khảo<br><input id="gu" placeholder="Nhập tài khoản..." style="width:100%"></label>
      <label class="sm" style="margin-top:8px;display:block">Mật khẩu / Mã PIN<br><input id="gp" type="password" placeholder="Nhập mật khẩu..." style="width:100%"></label>
      <p style="margin-top:14px"><button class="p" onclick="gvIn()">Đăng nhập chấm bài</button></p>
    </div>`;
}

async function gvIn(){
  const user=$('#gu').value.trim(), pin=$('#gp').value.trim();
  const r=await rpcG('g_login',{user,pin});
  if(!r.ok){alert(r.err);return}
  const l=await rpcG('g_list',{user,pin});
  D.imgs=Object.assign(D.imgs||{},l.imgs||{});
  GV={user,pin,...r,tasks:l.tasks||[],i:0};
  gvMain();
}

async function gvReload(){const l=await rpcG('g_list',{user:GV.user,pin:GV.pin});if(l.ok){D.imgs=Object.assign(D.imgs||{},l.imgs||{});GV.tasks=l.tasks;GV.i=Math.min(GV.i,Math.max(0,l.tasks.length-1))}gvMain()}

function gvMain(){
 const T=GV.tasks,t=T[GV.i],dn=T.filter(x=>x.items.every(i=>i.mine)).length,hd=`<div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>${esc(GV.name)}</b> · Vòng ${GV.round} (Môn ${currentSub})<div class="sm mu">Lớp phụ trách: ${esc(GV.classes)} · Đã chấm ${dn}/${T.length} bài</div></div><button onclick="gvReload()">Tải lại</button><button onclick="GV=null;gvView()">Thoát</button></div>`;
 if(!t){$('#app').innerHTML=hd+'<div class="c mu">Chưa có bài tự luận nào được nộp thuộc lớp bạn phụ trách.</div>';return}
 $('#app').innerHTML=hd+`<div class="ex"><div>${t.items.map((it,k)=>`<div class="c"><div class="sm mu">Bài ${GV.i+1} · Câu tự luận số ${it.no}</div><p style="white-space:pre-wrap"><b>${ER(it.stem)}</b></p><details><summary class="sm">Hướng dẫn chấm</summary><div class="sm pw">${esc(it.sol||'(chưa có)')}</div></details><div class="al" style="background:var(--bg);color:var(--tx)"><div class="pw">${esc(it.ans||'(thí sinh bỏ trống)')}</div></div>${paperGv(it,k)}<div class="tr"><span>Điểm (0 đến ${GV.emax}):</span><input id="sc${k}" type="number" min="0" max="${GV.emax}" step="0.25" value="${it.mine?it.mine.score:''}" style="width:90px"></div><input id="nt${k}" placeholder="Nhận xét (không bắt buộc)" value="${esc(it.mine?it.mine.note||'':'')}" style="width:100%;margin-top:6px"></div>`).join('')}
 <p><button onclick="GV.i--;gvMain()" ${GV.i?'':'disabled'}>← Bài trước</button> <button class="p" onclick="gvSave()">Lưu và bài sau →</button></p></div>
 <div class="c"><b class="sm">Danh sách bài</b><div class="pl" style="margin-top:8px">${T.map((x,i)=>`<button class="${x.items.every(z=>z.mine)?'d':''} ${i===GV.i?'u':''}" onclick="GV.i=${i};gvMain()">${i+1}</button>`).join('')}</div></div></div>`;
 hydrateImgs();gvAuto();
}

async function gvSave(){const t=GV.tasks[GV.i],b=t.items.map((it,k)=>({it,s:$('#sc'+k).value,n:$('#nt'+k).value}));
 if(b.some(x=>x.s===''||+x.s<0||+x.s>GV.emax)){alert(`Nhập điểm từ 0 đến ${GV.emax} cho mọi câu.`);return}

function getMatrixData(){
  let matrix = {};
  let totals = {mc:0, tf:0, sa:0, essay:0, all:0};
  
  D.bank.forEach(q=>{
    let tag = q.tag && q.tag.trim() !== '' ? q.tag.trim() : 'Chủ đề chung';
    let lvl = q.level || 'NB';
    let type = q.type || 'mc';
    if(!matrix[tag]) matrix[tag] = {NB:{mc:0,tf:0,sa:0,essay:0},TH:{mc:0,tf:0,sa:0,essay:0},VD:{mc:0,tf:0,sa:0,essay:0},VDC:{mc:0,tf:0,sa:0,essay:0}};
    if(matrix[tag][lvl] && matrix[tag][lvl][type] !== undefined) matrix[tag][lvl][type]++;
    
    totals[type]++;
    totals.all++;
  });
  return {matrix, totals};
}

function exportMatrixExcel(){
  if(!D.bank || D.bank.length === 0){ alert('Ngân hàng đề trống!'); return; }
  let {matrix, totals} = getMatrixData();
  
  let rowsData = [
    ["MA TRẬN ĐẶC TẢ ĐỀ THI MÔN " + currentSub.toUpperCase()],
    [],
    ["STT", "Chủ đề / Nội dung", "Mức độ đánh giá", "Số câu hỏi theo dạng thức", "", "", "", "Tổng số câu"],
    ["", "", "", "Nhiều lựa chọn", "Đúng / Sai", "Trả lời ngắn", "Tự luận", ""]
  ];
  
  let stt = 1;
  Object.keys(matrix).forEach(tag=>{
    ['NB','TH','VD','VDC'].forEach(lvl=>{
      let r = matrix[tag][lvl];
      let sum = r.mc + r.tf + r.sa + r.essay;
      if(sum > 0){
        rowsData.push([stt++, tag, LV[lvl], r.mc||0, r.tf||0, r.sa||0, r.essay||0, sum]);
      }
    });
  });

  rowsData.push(["", "TỔNG CỘNG:", "", totals.mc, totals.tf, totals.sa, totals.essay, totals.all]);

  let ws = XLSX.utils.aoa_to_sheet(rowsData);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "MaTranDacTa");
  XLSX.writeFile(wb, `MaTrandacta_${currentSub}.xlsx`);
}

const FXG=(()=>{const G={},sh={};let sub=null,grp=null;
  FXTXT.split('\n').forEach(l=>{l=l.trim();if(!l)return;
    if(l[0]==='#'){sub=l.slice(1).trim();if(sub!=='*')G[sub]=G[sub]||{};return}
    if(l[0]==='@'){grp=l.slice(1).trim();(sub==='*'?sh:G[sub])[grp]=[];return}
    if(l[0]==='+'){G[sub][l.slice(1).trim()]=sh[l.slice(1).trim()];return}
    const i=l.indexOf(' => ');if(i<0)return;
    let sn=l.slice(i+4).trim();if(/^\\[a-zA-Z]+$/.test(sn))sn+=' ';
    (sub==='*'?sh:G[sub])[grp].push([l.slice(0,i).trim(),sn]);
  });return G})();

// Chèn vào vị trí con trỏ; tự bọc $...$ nếu con trỏ đang ở ngoài công thức; gộp với công thức liền kề
function fxInsRaw(sn){
  const t=$('#esTxt');if(!t||!sn)return;
  const st=t.selectionStart==null?t.value.length:t.selectionStart,en=t.selectionEnd==null?st:t.selectionEnd;
  let before=t.value.slice(0,st);const sel=t.value.slice(st,en),after=t.value.slice(en);
  const raw=sn[0]==='!';if(raw)sn=sn.slice(1);
  const inside=((before.replace(/\\\$/g,'').match(/\$/g)||[]).length%2)===1;
  let pos=sn.indexOf('‸');const hasM=pos>=0;let body=hasM?sn.replace('‸',''):sn;if(!hasM)pos=body.length;
  if(hasM&&sel){body=body.slice(0,pos)+sel+body.slice(pos);pos+=sel.length}
  let open='$',close='$';
  if(raw||inside){open='';close=''}
  else if(before.endsWith('$')&&!before.endsWith('\\$')){before=before.slice(0,-1);open=''}   // $a$ + $b$ -> $ab$
  t.value=before+open+body+close+after;

}

function compressImg(file,max=1800,q=.75){
  return new Promise((ok,no)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');
      c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
    im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Không đọc được ảnh (định dạng không hỗ trợ?)'))};
    im.src=u;
  });

async function ocrRun(t,k,force){
  const it=t.items[k];it._busy=1;it._err='';ocrRefresh(t,k);
  const r=await rpcG('ai_ocr',{user:GV.user,pin:GV.pin,sbd:t.id,idx:it.idx,force:force?1:0});

}

//  - "PHẦN 1/2/3/4" (hoặc I/II/III/IV): đặt dạng câu mặc định (NLC / Đúng-Sai / TLN / Tự luận)
//  - "CHỦ ĐỀ: ..." đặt chủ đề (tag) cho các câu sau
//  - "Câu N. [NB|TH|VD|VDC] [TF|TLN|TL] ..." mở một câu mới
//  - Trắc nghiệm: đáp án đúng = chữ cái A/B/C/D được GẠCH CHÂN (hoặc "*A." / dòng "ĐÁP ÁN: A")
//  - Đúng/Sai: "a) [NB]# nội dung"; mệnh đề Đúng = chữ "a)" được GẠCH CHÂN (hoặc "ĐÁP ÁN: a-Đ b-S ...")
//  - Trả lời ngắn: "Trả lời: [[4,9||4.9]]" (nhiều đáp án chấp nhận, ngăn bằng ||)
//  - "[HDG]" mở phần hướng dẫn giải (đến hết câu)

const UNI={'−':'-','–':'-','≤':'\\le ','≥':'\\ge ','≠':'\\ne ','∞':'\\infty ','π':'\\pi ','×':'\\times ','·':'\\cdot ','⋅':'\\cdot ','÷':'\\div ','∈':'\\in ','∉':'\\notin ','∪':'\\cup ','∩':'\\cap ','→':'\\to ','⇒':'\\Rightarrow ','⇔':'\\Leftrightarrow ','∀':'\\forall ','∃':'\\exists ','α':'\\alpha ','β':'\\beta ','γ':'\\gamma ','Δ':'\\Delta ','δ':'\\delta ','θ':'\\theta ','λ':'\\lambda ','μ':'\\mu ','ω':'\\omega ','Ω':'\\Omega ','φ':'\\varphi ','σ':'\\sigma ','°':'^\\circ ','≈':'\\approx ','±':'\\pm ','∠':'\\angle ','∥':'\\parallel ','⊥':'\\perp ','ℝ':'\\mathbb{R} ','ℕ':'\\mathbb{N} ','ℤ':'\\mathbb{Z} ','ℚ':'\\mathbb{Q} ','∅':'\\emptyset ','⊂':'\\subset ','⊆':'\\subseteq ','′':"'",'²':'^2','³':'^3','√':'\\sqrt ','∫':'\\int '};
const FNAMES=new Set(['sin','cos','tan','cot','sec','csc','arcsin','arccos','arctan','log','ln','lim','max','min','exp','det','sup','inf']);
const VNCH=/[àáảãạăằắẳẵặâầấẩẫậèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i;
function mt(s){
  const t=s.trim();
  if(FNAMES.has(t)) return '\\'+t+' ';
  if(VNCH.test(s)) return '\\text{'+s.replace(/[\\{}%#&$_^~]/g,' ')+'}';
  return s.replace(/[%#&${}]/g,c=>'\\'+c).replace(/[^\x00-\x7F]/g,c=>UNI[c]||c);
}
const ACC={'\u20D7':'overrightarrow','\u20D6':'overleftarrow','\u0302':'widehat','\u0303':'widetilde','\u0304':'overline','\u0305':'overline','\u0307':'dot','\u030C':'check'};
const DL={'':'.','{':'\\{','‖':'\\|','⟨':'\\langle ','⌊':'\\lfloor ','⌈':'\\lceil '},DR={'':'.','}':'\\}','‖':'\\|','⟩':'\\rangle ','⌋':'\\rfloor ','⌉':'\\rceil '};

function omml(n){
  if(!n) return '';
  const ln=n.localName;
  if(/Pr$/.test(ln)) return '';
  const kids=[...n.children],K=x=>kids.find(e=>e.localName===x),KS=x=>kids.filter(e=>e.localName===x);
  const all=()=>kids.map(omml).join('');
  const prop=(pr,t)=>{const e=pr&&[...pr.children].find(x=>x.localName===t);return e?(e.getAttribute('m:val')||''):null};
  switch(ln){
    case 't': return mt(n.textContent);
    case 'f': return `\\frac{${omml(K('num'))}}{${omml(K('den'))}}`;
    case 'sSup': return `{${omml(K('e'))}}^{${omml(K('sup'))}}`;
    case 'sSub': return `{${omml(K('e'))}}_{${omml(K('sub'))}}`;
    case 'sSubSup': return `{${omml(K('e'))}}_{${omml(K('sub'))}}^{${omml(K('sup'))}}`;
    case 'rad': {const d=omml(K('deg')).trim();return `\\sqrt${d?`[${d}]`:''}{${omml(K('e'))}}`}
    case 'd': {
      const pr=K('dPr'),b=prop(pr,'begChr'),e2=prop(pr,'endChr'),sp=prop(pr,'sepChr');
      const L=c=>c===null?'(':(DL[c]||c),R=c=>c===null?')':(DR[c]||c);
      return `\\left${L(b)}${KS('e').map(omml).join(sp===null?'|':sp)}\\right${R(e2)}`;
    }
    case 'eqArr': return `\\begin{aligned}${KS('e').map(omml).join('\\\\')}\\end{aligned}`;
    case 'm': return `\\begin{matrix}${KS('mr').map(r=>[...r.children].filter(e=>e.localName==='e').map(omml).join('&')).join('\\\\')}\\end{matrix}`;
    case 'nary': {
      const c=prop(K('naryPr'),'chr'),sym=c===null?'∫':c;
      const m={'∑':'\\sum','∏':'\\prod','∫':'\\int','∬':'\\iint','∭':'\\iiint','∮':'\\oint'}[sym]||'\\int',sb=omml(K('sub')).trim(),sp=omml(K('sup')).trim();
      return `${m}${sb?`_{${sb}}`:''}${sp?`^{${sp}}`:''} ${omml(K('e'))}`;
    }
    case 'func': return `${omml(K('fName'))} ${omml(K('e'))}`;
    case 'limLow': return `${omml(K('e'))}_{${omml(K('lim'))}}`;
    case 'limUpp': return `${omml(K('e'))}^{${omml(K('lim'))}}`;
    case 'bar': return prop(K('barPr'),'pos')==='bot'?`\\underline{${omml(K('e'))}}`:`\\overline{${omml(K('e'))}}`;
    case 'acc': {const c=prop(K('accPr'),'chr');return `\\${ACC[c===null?'\u0302':c]||'hat'}{${omml(K('e'))}}`}
    default: return all();
  }
}

const idOf=t=>String(t||'').split('/').pop().replace(/\.[^.]+$/,'').replace(/\W/g,'_');
const kid=(n,t)=>[...n.children].find(x=>x.localName===t);

function runText(r,rel,imgs,st){
  let s='';
  const rp=kid(r,'rPr'),va=rp&&kid(rp,'vertAlign'),vt=va&&va.getAttribute('w:val');
  const u=rp&&kid(rp,'u'),under=!!u&&u.getAttribute('w:val')!=='none';
  for(const c of r.children){
    switch(c.localName){
      case 't': s+=c.textContent;break;
      case 'tab': s+=' ';break;
      case 'noBreakHyphen': s+='-';break;
      case 'br': case 'cr': s+='\n';break;
      case 'drawing': case 'pict': case 'object': case 'AlternateContent': {
        const b=c.getElementsByTagName('a:blip')[0],d=c.getElementsByTagName('v:imagedata')[0];
        const rid=b?b.getAttribute('r:embed'):d?d.getAttribute('r:id'):null;
        if(rid){const id=idOf(rel[rid]);if(imgs[id]) s+=` ⟪IMG:${id}⟫ `;else{st.skipped++;s+=' [hình không hỗ trợ] '}}
      }
    }
  }
  if(under&&/^\s*[A-Da-d][\.\)]?\s*$/.test(s)) s='*'+s.trim();   // chữ cái đáp án được gạch chân => đáp án đúng
  if(vt==='superscript'&&s.trim()) return `$^{${s.trim()}}$`;
  if(vt==='subscript'&&s.trim()) return `$_{${s.trim()}}$`;
  return s;
}

function paraText(p,rel,imgs,st){
  let out='';
  (function walk(n){
    for(const c of n.children){
      switch(c.localName){
        case 'pPr': case 'rPr': break;
        case 'oMath': out+='$'+omml(c)+'$';break;
        case 'r': out+=runText(c,rel,imgs,st);break;
        default: walk(c);
      }
    }
  })(p);
  return out;
}

async function docxToLines(zip){
  const rel={},imgs={},st={skipped:0};
  const rf=zip.file('word/_rels/document.xml.rels');
  if(rf){
    const rx=await rf.async('string');
    [...new DOMParser().parseFromString(rx,'text/xml').getElementsByTagName('Relationship')].forEach(r=>rel[r.getAttribute('Id')]=r.getAttribute('Target'));
  }
  const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',bmp:'image/bmp',webp:'image/webp',svg:'image/svg+xml'};
  for(const path of Object.keys(zip.files)){
    if(!/^word\/media\//i.test(path)) continue;
    const mime=MIME[path.split('.').pop().toLowerCase()];
    if(mime) imgs[idOf(path)]=`data:${mime};base64,`+await zip.file(path).async('base64');
  }
  const df=zip.file('word/document.xml');
  if(!df) throw new Error('Không phải file .docx hợp lệ');
  const xml=new DOMParser().parseFromString(await df.async('string'),'text/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('document.xml không hợp lệ');
  const lines=[];
  for(const p of xml.getElementsByTagName('w:p'))
    paraText(p,rel,imgs,st).split('\n').map(x=>x.normalize('NFC').replace(/\s+/g,' ').trim()).filter(Boolean).forEach(x=>lines.push(x));
  return {lines,imgs,skipped:st.skipped};
}

// ---------- Phân tích cấu trúc đề ----------
function maskMath(s){
  const m=[];
  return {s:s.replace(/\$[^$]*\$/g,x=>{m.push(x);return '\u0001'+(m.length-1)+'\u0002'}),un:t=>t.replace(/\u0001(\d+)\u0002/g,(_,i)=>m[i])};
}
// Tách "A. ... B. ... C. ... D. ..." (một hoặc nhiều dòng); chữ cái phải tăng dần để không tách nhầm "điểm A. ..."
function splitOpts(l){
  const mk=maskMath(l),s=mk.s;
  const ms=[...s.matchAll(/(?<=^|[\s\u0002])(\*?)([A-D])[\.\)]\s*/g)];
  if(!ms.length||ms[0].index!==0) return null;
  const pick=[];let last='';
  for(const m of ms) if(m[2]>last){pick.push(m);last=m[2]}
  const o={},star=[];
  pick.forEach((m,i)=>{
    const end=i+1<pick.length?pick[i+1].index:s.length;
    o[m[2]]=mk.un(s.slice(m.index+m[0].length,end).trim());
    if(m[1]) star.push(m[2]);
  });
  return {o,star};
}

function setAns(q,t,st){
  t=t.trim();
  if(q.type==='mc'){
    const m=t.match(/^[\s\(\[\*]*([A-D])(?![A-Za-zÀ-ỹ])/i);
    if(m){q.ans=[m[1].toUpperCase()];q._a=1}
  }else if(q.type==='tf'){
    const re=/([a-d])\s*[-–:=)]?\s*(đúng|sai|đ|s|t|f)(?![A-Za-zÀ-ỹ])/gi;let m,n=0;
    while((m=re.exec(t))){q.st['abcd'.indexOf(m[1].toLowerCase())].ok=/^(đ|t)/i.test(m[2]);n++}
    if(n===4) q._a=1;
    else{const cl=t.replace(/[\s,;.\-]/g,'');if(/^[ĐSTF]{4}$/i.test(cl)){[...cl].forEach((c,i)=>q.st[i].ok=/[ĐT]/i.test(c));q._a=1}}
  }else if(q.type==='sa'){
    const inner=t.match(/\[\[(.*)\]\]/);
    q.ans=(inner?inner[1].split('||'):t.split(/\s*;\s*/)).map(x=>x.trim()).filter(Boolean);
    if(q.ans.length) q._a=1;
  }
}

function parseLines(lines){
  const bank=[],warn=[];
  let cur=null,tag='Chủ đề chung',dt='mc',inSol=false;
  const useStar=lines.some(l=>/(^|\s)\*[A-Da-d][\.\)]/.test(l));   // file dùng quy ước gạch chân
  const LVX=/\[(NB|TH|VD|VDC)\]/i,TYX=/\[(ĐS|Đúng[\/\s]?Sai|TF|TLN|Trả lời ngắn|TL|Tự luận|TN)\]/i;
  const SEC={'1':'mc','I':'mc','2':'tf','II':'tf','3':'sa','III':'sa','4':'essay','IV':'essay'};
  const LVR={NB:1,TH:2,VD:3,VDC:4};
  const flush=()=>{
    if(!cur) return;
    const q=cur,id='Câu '+(bank.length+1)+' ('+TY[q.type]+')',w=[];
    q.stem=q.stem.trim();q.sol=q.sol.trim();
    if(q.type==='mc'){
      if(Object.values(q.opt).filter(Boolean).length<2) w.push('thiếu phương án A-D');
      if(q._stars>1) w.push('có '+q._stars+' đáp án được đánh dấu');
      if(!q._a){q.ans=[];w.push('chưa xác định được đáp án (chưa gạch chân / chưa có ĐÁP ÁN)')}
    }else if(q.type==='tf'){
      if(q._n<4) w.push('chỉ có '+q._n+'/4 mệnh đề');
      if(!q._a) w.push('chưa xác định được Đúng/Sai');
      else if(!q.st.some(s=>s.ok)) w.push('cả 4 mệnh đề đều Sai - kiểm tra lại gạch chân');
      if(q._lvDefault) q.level=q.st.reduce((a,s)=>LVR[s.lv]>LVR[a]?s.lv:a,'NB');
    }else if(q.type==='sa'){
      if(!q._a){q.ans=[];w.push('chưa có đáp án trả lời ngắn')}
    }else if(q.type==='essay'&&!q.sol) w.push('chưa có hướng dẫn chấm');
    q.warn=w;w.forEach(x=>warn.push(id+': '+x));
    delete q._a;delete q._n;delete q._stars;delete q._lvDefault;
    bank.push(q);cur=null;
  };
  lines.forEach(l=>{
    const sec=l.length<150&&l.match(/^PHẦN\s*(IV|III|II|I|[1-4])(?![A-Za-z0-9])/i);
    if(sec){flush();dt=SEC[sec[1].toUpperCase()];inSol=false;return}
    const tg=l.match(/^(?:CHỦ\s*ĐỀ|CHUYÊN\s*ĐỀ|TAG)\s*[:\-–]\s*(.+)$/i);
    if(tg){flush();tag=tg[1].trim();inSol=false;return}
    const m=l.match(/^(?:Câu|Bài|Q)\s*(\d+)\s*[\.\:\)]?\s*(.*)$/i);
    if(m){
      flush();inSol=false;
      let t=m[2];const lm=t.match(LVX),lv=lm?lm[1]:'NB';t=t.replace(LVX,'');
      let ty=dt;const tm=t.match(TYX);
      if(tm){const x=tm[1];ty=/^(đs|đúng|tf)/i.test(x)?'tf':/^(tln|trả)/i.test(x)?'sa':/^(tl|tự)/i.test(x)?'essay':'mc';t=t.replace(TYX,'')}
      cur={type:ty,level:lv.toUpperCase(),tag,stem:t.trim(),opt:{A:'',B:'',C:'',D:''},
        st:'abcd'.split('').map(k=>({k,t:'Phát biểu '+k,lv:'NB',ok:false})),ans:[],sol:'',_a:0,_n:0,_stars:0,_lvDefault:!lm};
      return;
    }
    if(!cur) return;
    if(/^Vị trí đặt lời giải/i.test(l)) return;
    const am=l.match(/^(?:(?:ĐÁP\s*ÁN|KEY|TRẢ\s*LỜI)\s*[:\-–]|ĐA\s*:)\s*(.+)$/i);
    if(am&&(!inSol||/\[\[/.test(l))){setAns(cur,am[1]);inSol=false;return}
    const sm=l.match(/^(?:\[HDG\]|(?:HDG|Lời giải|Hướng dẫn giải)\s*:)\s*(.*)$/i);
    if(sm){cur.sol=sm[1];inSol=true;return}
    if(inSol){cur.sol+=(cur.sol?'\n':'')+l;return}
    // Mệnh đề Đúng/Sai: "a) [NB]# nội dung" (chữ "a)" gạch chân => Đúng)
    if(cur.type==='tf'||(cur.type==='mc'&&!cur.opt.A)){
      const tm2=l.match(/^(\*?)\s*([a-d])\s*[\.\)]\s*(.*)$/);
      if(tm2&&(cur.type==='tf'||LVX.test(tm2[3]))){
        cur.type='tf';
        let t=tm2[3];const lm=t.match(LVX),lv=lm?lm[1]:'NB';
        t=t.replace(LVX,'').trim().replace(/^#\s*/,'');
        cur.st['abcd'.indexOf(tm2[2])]={k:tm2[2],t,lv:lv.toUpperCase(),ok:!!tm2[1]};
        cur._n++;
        if(tm2[1]||(useStar&&cur._n>=4)) cur._a=1;
        return;
      }
    }
    if(cur.type==='mc'){
      const so=splitOpts(l);
      if(so){
        Object.assign(cur.opt,so.o);
        if(so.star.length){cur._stars+=so.star.length;cur.ans=[so.star[0]];cur._a=1}
        return;
      }
    }
    cur.stem+='\n'+l;
  });
  flush();
  return {bank,warn};
}

async function importFile(e){
  const file=e.target.files[0];if(!file) return;
  const name=file.name.toLowerCase();
  try{
    if(name.endsWith('.json')){
      const d=JSON.parse(await file.text());
      if(!d.bank) throw new Error('Thiếu trường bank');
      D.bank=d.bank;if(d.imgs) D.imgs=d.imgs;if(d.cfg) D.cfg=Object.assign(D.cfg,d.cfg);
      save();show();alert('Nhập JSON thành công!');
    }else if(name.endsWith('.docx')){
      const zip=await new JSZip().loadAsync(file);
      const {lines,imgs,skipped}=await docxToLines(zip);
      const {bank,warn}=parseLines(lines);
      if(!bank.length){alert('Không tìm thấy câu hỏi nào (định dạng "Câu 1. ...").');return}
      D.bank=bank.map((q,i)=>normKey({...q,no:i+1}));
      D.cfg.codes=[];                                   // ngân hàng đổi => mã đề cũ không còn đúng
      const used=new Set([...JSON.stringify(D.bank).matchAll(/⟪IMG:(\w+)⟫/g)].map(m=>m[1]));
      D.imgs={};used.forEach(id=>{if(imgs[id]) D.imgs[id]=imgs[id]});
      save();show();
      alert(`Đã nhập ${bank.length} câu.`+(skipped?`\n${skipped} hình EMF/WMF không hiển thị được (hãy dùng Equation của Word hoặc PNG).`:'')+(warn.length?`\n\nCẦN KIỂM TRA (${warn.length}):\n`+warn.slice(0,15).join('\n')+(warn.length>15?`\n... và ${warn.length-15} cảnh báo khác (xem cột nội dung trong bảng)`:''):'\n\nKhông có cảnh báo.')+'\n\nNhớ sinh lại mã đề và đăng đề.');
    }else alert('Chỉ nhận .docx hoặc .json');
  }catch(err){alert('Không đọc được file: '+err.message)}
  e.target.value='';
}

// Đồng bộ key/keys với ans/st để server chấm điểm
function normKey(q){
  const o={...q};
  if(o.type==='mc') o.key=(o.ans||[])[0]||'';
  if(o.type==='tf') o.keys=(o.st||[]).map(s=>!!s.ok);
  return o;
}
// Cắt chuỗi hiển thị nhưng không cắt giữa $...$ hoặc ⟪IMG:..⟫
function cut(s,n){
  s=String(s);if(s.length<=n) return s;
  let t=s.slice(0,n);
  if((t.match(/\$/g)||[]).length%2){const j=s.indexOf('$',n);t=j<0?s:s.slice(0,j+1)}
  if(t.lastIndexOf('⟪')>t.lastIndexOf('⟫')){const j=s.indexOf('⟫',n);t=j<0?s:s.slice(0,j+1)}
  return t+(t.length<s.length?' …':'');
}
// Sửa đáp án ngay trong bảng ngân hàng (không cần sửa lại file Word)
function bankFix(i,fn){
  const q=D.bank[i];fn(q);
  q.warn=(q.warn||[]).filter(w=>!/đáp án|Đúng\/Sai|gạch chân/i.test(w));
  D.bank[i]=normKey(q);D.cfg.codes=[];save();show();
}
function bankMc(i,v){bankFix(i,q=>{q.ans=v?[v]:[]})}
function bankTf(i,k,v){bankFix(i,q=>{q.st[k].ok=v})}
function bankSa(i,v){bankFix(i,q=>{q.ans=String(v).split('||').map(x=>x.trim()).filter(Boolean)})}
function qDetail(q,i){
  let h=ER(cut(q.stem,300));
  if(q.type==='mc'&&q.opt){
    const a=(q.ans||[])[0]||'';
    h+='<div class="sm" style="margin-top:4px">'+['A','B','C','D'].map(k=>`<span style="${a===k?'color:var(--ok);font-weight:700':''}">${k}. ${ER(q.opt[k])}${a===k?' ✓':''}</span>`).join(' &nbsp; ')+'</div>';
    h+=`<div class="sm">Đáp án đúng: <select onchange="bankMc(${i},this.value)"><option value="">—</option>${['A','B','C','D'].map(k=>`<option ${a===k?'selected':''}>${k}</option>`).join('')}</select></div>`;
  }
  if(q.type==='tf'&&q.st) h+=q.st.map((s,k)=>`<div class="sm" style="color:${s.ok?'var(--ok)':'var(--er)'}">${s.k}) [${esc(s.lv)}] ${ER(s.t)} → <select onchange="bankTf(${i},${k},this.value==='1')"><option value="1" ${s.ok?'selected':''}>Đúng</option><option value="0" ${s.ok?'':'selected'}>Sai</option></select></div>`).join('');
  if(q.type==='sa') h+=`<div class="sm">Đáp án: <input style="width:220px" value="${esc((q.ans||[]).join(' || '))}" onchange="bankSa(${i},this.value)" title="Nhiều đáp án chấp nhận: ngăn bằng ||"></div>`;
  if(q.type==='essay'&&q.sol) h+=`<div class="sm mu"><b>HDG:</b> ${ER(cut(q.sol,120))}</div>`;
  if(q.warn&&q.warn.length) h+=q.warn.map(x=>` <span class="bd w">${esc(x)}</span>`).join('');
  return h;
}

function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function gen(){
  if(!D.bank.length){alert('Ngân hàng đề đang trống.');return}
  const n=Math.min(50,Math.max(1,parseInt($('#nc').value)||4));
  const bad=D.bank.filter(q=>q.type==='mc'&&!(q.ans||[])[0]||q.type==='sa'&&!(q.ans||[]).filter(Boolean).length);
  if(bad.length&&!confirm(bad.length+' câu chưa có đáp án (câu '+bad.slice(0,10).map(q=>q.no).join(', ')+'). Những câu này sẽ luôn tính 0 điểm. Vẫn sinh mã đề?')) return;
  const order=['mc','tf','sa','essay'],codes=[];
  for(let i=1;i<=n;i++){
    const r=rng(i*7919+D.bank.length);
    let qs=order.flatMap(t=>{const g=D.bank.filter(q=>q.type===t).map(q=>normKey(JSON.parse(JSON.stringify(q))));
      if(i>1) for(let k=g.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[g[k],g[j]]=[g[j],g[k]]}   // mã 0101 giữ thứ tự gốc
      return g});
    codes.push({code:String(100+i).padStart(4,'0'),qs});
  }
  D.cfg.codes=codes;D.cfg.n=n;
  save();show();
  alert(`Đã sinh ${n} mã đề, mỗi mã ${D.bank.length} câu (mã 0101 giữ thứ tự gốc, các mã khác xáo thứ tự trong từng dạng câu).`);
}

  const pl = cd.qs.map((x,i)=>{
    const v = S.ans[i];
    const done = (Array.isArray(v) ? v.some(z=>z!=null) : (v!==undefined && v!=='')) || (((S.files||{})[i]||[]).length>0);
    return `<button class="${done?'d':''} ${S.flag?.[i]?'f':''} ${i===S.qi?'u':''}" onclick="S.qi=${i};push();exam()">${i+1}</button>`;
  }).join('');

  $('#app').innerHTML=`
    <div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="flex:1"><b>${esc(S.title||'Bài thi')} · Môn ${currentSub}</b> · Mã đề ${S.code}<div class="sm mu">${esc(S.name)} · SBD ${esc(S.sbd)}</div></div>
      <div id="tm">--:--</div>
      <button class="p" onclick="submit()">Nộp bài</button>
    </div>
    <div class="ex">
      <div class="c">
        ${q.pass?`<div class="al sm" style="white-space:pre-wrap;background:var(--bg);color:var(--tx)">${ER(q.pass)}</div>`:''}
        <div class="sm mu">Câu ${S.qi+1}/${cd.qs.length} <span class="bd">${TY[q.type]}</span> ${q.level?`<span class="bd">${LV[q.level]}</span>`:''}</div>
        <p style="white-space:pre-wrap">${ER(q.stem)}</p>
        ${b}
        <p style="margin-top:16px">
          <button onclick="S.qi=Math.max(0,S.qi-1);push();exam()">← Trước</button> 
          <button onclick="S.flag=S.flag||{};S.flag[S.qi]=!S.flag[S.qi];push();exam()">${S.flag?.[S.qi]?'Bỏ đánh dấu':'⚑ Đánh dấu'}</button> 
          <button onclick="S.qi=Math.min(${cd.qs.length-1},S.qi+1);push();exam()">Sau →</button>
        </p>
      </div>
      <div class="c">
        <b class="sm">Bảng câu hỏi</b>
        <div class="pl" style="margin-top:8px">${pl}</div>
        <p class="sm mu">Xanh: đã làm · Vàng: xem lại.</p>
      </div>
    </div>`;

  clearInterval(T); T=setInterval(tick, 500); tick();
  hydrateImgs(); pvUpdate();
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){window._pickUntil=Math.min(window._pickUntil||0,Date.now()+2000);return}
  if(Date.now()<(window._pickUntil||0))return;   // đang mở camera/chọn ảnh
  if(mode==='hs'&&S&&!S.done&&!S.fin){S.viol=(S.viol||0)+1;push()}
});
function ans(v, keep){ S.ans[S.qi] = v; push(); if(!keep) exam(); }
function tf(k, v){ const a = (S.ans[S.qi] || [null,null,null,null]).slice(); a[k] = v; S.ans[S.qi] = a; push(); exam(); }

function tick(){const r=Math.max(0,Math.round(((S.endAt||S.start+D.cfg.min*60000)-(Date.now()+(S.off||0)))/1000)),e=$('#tm');if(e)e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0&&!S.fin)fin()}
function submit(){if(confirm('Nộp bài thi '+currentSub+'?'))fin()}
async function fin(){if(S.fin)return;S.fin=1;clearInterval(T);
 const r=await api('submit',{sbd:S.sbd,subject:currentSub,token:S.token,ans:S.ans,viol:S.viol});
 if(!r.ok){S.fin=0;alert(r.err);return}
 S.g=r.g;S.done=true;result()}
function result(){const g=S.g||{p:0};$('#app').innerHTML=`<div class="c" style="max-width:520px;margin:30px auto 12px;text-align:center"><h2>Đã nộp bài môn ${currentSub}!</h2><div style="font-size:2.4rem;font-weight:800;color:var(--pr)">${g.p.toFixed(2)}<span class="mu" style="font-size:1rem"> /10</span></div><div class="sm mu">Điểm phần trắc nghiệm / trả lời ngắn. Điểm tự luận sẽ được công bố sau khi giám khảo chấm.</div><button onclick="S=null;login()" style="margin-top:8px">Thoát</button></div><div class="c" id="fbBox" style="max-width:860px;margin:0 auto 30px"></div>`;fbLoad()}

const _moObs = new MutationObserver(()=>{ clearTimeout(window._mjTimer); window._mjTimer = setTimeout(()=>{ if(window.renderMathInElement) renderMathInElement($('#app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }, 40); });
window.addEventListener('load', ()=>{ _moObs.observe($('#app'),{childList:true,subtree:true}); if(window.renderMathInElement) renderMathInElement($('#app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); });

if(/[?&](thi|cham)/.test(location.search)){mode=/[?&]cham/.test(location.search)?'gv':'hs';['#r1','#r2','#r3'].forEach(x=>$(x).style.display='none')}
show();
</script></body></html>
