<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống thi ĐGNL Đa Môn - Bảo mật tuyệt đối</title>
<style>
:root{--bg:#f5f6fa;--cd:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--pr:#1d4ed8;--ps:#e3ebff;--ok:#12805c;--er:#c0392b;--wa:#b7791f;--ws:#fdf0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--cd:#18202f;--tx:#e8ecf5;--mu:#9aa5ba;--bd:#2b3549;--pr:#6e9bff;--ps:#1d2c52;--ok:#4fd1a1;--er:#ff8b7b;--wa:#f0b955;--ws:#473410;color-scheme:dark}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav b{flex:1;min-width:140px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:.85rem}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:9px;padding:7px 12px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.on{background:var(--ps);border-color:var(--pr)}button:disabled{opacity:.5}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
textarea{width:100%;min-height:80px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}.tw table{font-size:.88rem}th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bd{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--ps);color:var(--pr)}.bd.w{background:var(--ws);color:var(--wa)}
.ex{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}@media(max-width:800px){.ex{grid-template-columns:1fr}}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pl button{padding:6px 0}.pl .d{background:var(--ps);border-color:var(--pr)}.pl .f{background:var(--ws);border-color:var(--wa)}.pl .u{outline:2px solid var(--pr)}
.tr{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);padding:7px 0}.tr span{flex:1}
pre{white-space:pre-wrap;margin:0;font:inherit}
#tm{font:700 1.2rem ui-monospace,monospace;padding:3px 10px;border-radius:99px;background:var(--ps);color:var(--pr)}
.al{background:var(--ws);color:var(--wa);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sub-bar{background:var(--ps);padding:6px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head><body>
<div class="nav">
  <b>🎯 Hệ thống thi ĐGNL Đa Môn</b>
  <span id="subSelectorBox" class="sm">Môn: 
    <select id="globalSub" onchange="changeSubject(this.value)">
      <option value="Toan">Toán học</option>
      <option value="Van">Ngữ văn</option>
      <option value="Anh">Tiếng Anh</option>
      <option value="Ly">Vật lý</option>
      <option value="Hoa">Hóa học</option>
      <option value="Sinh">Sinh học</option>
    </select>
  </span>
  <button id="r1" onclick="role('ad')">Quản trị</button>
  <button id="r2" onclick="role('hs')">Thí sinh</button>
  <button id="r3" onclick="role('gv')">Giám khảo</button>
</div>
<div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbz7u3EOWEBxTTsNipd3613Nk0m8WXyg0mYznDQUmgGxwSrN7lMW8nC8Ef1Cw6VihdzyoA/exec';
const LV={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng',VDC:'VD cao'},TY={mc:'Nhiều lựa chọn',tf:'Đúng/Sai',sa:'Trả lời ngắn',essay:'Tự luận'};
const ER=s=>esc(s).replace(/⟪IMG:(\w+)⟫/g,(m,id)=>D.imgs&&D.imgs[id]?`<img src="${D.imgs[id]}" style="max-width:100%;max-height:160px;display:block;margin:6px 0;vertical-align:middle">`:'[hình]');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLE=[
{type:'mc',level:'NB',tag:'Hàm số',stem:'Giá trị nhỏ nhất của $f(x)=x^2-4x+3$ là',opt:{A:'−1',B:'0',C:'1',D:'3'},ans:['A'],sol:'f(x)=(x−2)²−1.'},
{type:'tf',level:'TH',tag:'Hàm số',stem:'Cho $f(x)=x^3-3x$.',st:[{k:'a',t:'$f\'(x)=3x^2-3$.',lv:'NB',ok:true},{k:'b',t:'Hàm số đồng biến trên ℝ.',lv:'TH',ok:false},{k:'c',t:'Cực đại tại $x=-1$.',lv:'TH',ok:true},{k:'d',t:'$f(2)=3$.',lv:'VD',ok:false}],sol:''},
{type:'sa',level:'VD',tag:'Đại số',stem:'Tích các nghiệm của $x^2-7x+10=0$ là',ans:['10'],sol:'Viète.'},
{type:'essay',level:'VD',tag:'Xác suất',stem:'Trình bày suy luận giải bài toán xác suất toàn phần...',sol:'Rubric: lập sơ đồ 0,5; công thức 1,0; kết quả 0,5.'}
];
const ROSTER='10001,Nguyễn Văn An,12A1,0101,123456\n10002,Trần Thị Bình,12A1,0102,123456\n10003,Lê Minh Châu,12A2,0103,123456';

let currentSub = 'Toan';
let D = loadSub(currentSub);

function init(sub){return{bank:SAMPLE.map((q,i)=>({...q,no:i+1})),cfg:{name:'Kỳ thi thử '+sub,mon:sub,min:30,n:4,codes:[],emax:2,thr:1},roster:ROSTER,subs:{},gr:[],grades:{},imgs:{}}}
function loadSub(sub){
  try{const d=JSON.parse(localStorage.getItem('dgnl_sub_'+sub));if(d&&d.bank)return d}catch(e){}
  return init(sub);
}
function save(){
  try{localStorage.setItem('dgnl_sub_'+currentSub,JSON.stringify(D))}catch(e){alert('Bộ nhớ trình duyệt đầy.')}
  push();
}

function changeSubject(sub){
  currentSub = sub;
  D = loadSub(sub);
  D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
  const sel = document.getElementById('globalSub'); if(sel) sel.value = sub;
  show();
}

D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
let OV=[],ONL=false,GV=null,S=null,T=null,tab='bank',mode='ad',adminAuthed=false;

async function api(a,p){
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,subject:currentSub,...p})});
    const t=await r.text();
    try{return JSON.parse(t)}catch(e){return{ok:false,err:'Lỗi kết nối máy chủ'}}
  }catch(e){return{ok:false,err:'Không kết nối mạng'}}
}

function AK(){
  return sessionStorage.getItem('ak') || '';
}

async function adminLogin(){
  const pass=document.getElementById('adPass').value.trim();
  if(!pass){alert('Vui lòng nhập mật khẩu quản trị!');return;}
  const r=await api('admin_login',{key:pass});
  if(r.ok){
    sessionStorage.setItem('ak',pass);
    adminAuthed=true;
    show();
  }else{
    alert(r.err||'Mật khẩu Quản trị không chính xác');
  }
}

async function pub(){
  const errors=validateBankForPublish(D.bank);
  if(errors.length){alert('Không thể đăng đề. Cần sửa các lỗi sau:\n\n'+errors.slice(0,20).join('\n'));return}
  const r=await api('publish',{key:AK(),cfg:D.cfg,codes:D.cfg.codes,roster:D.roster,gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr},imgs:D.imgs});
  alert(r.ok?`Đăng thành công môn ${currentSub} (${r.n} mã đề, ${r.hs} thí sinh)!`:r.err);
}

async function refresh(){
  const r=await api('stats',{key:AK()});
  if(!r.ok){alert(r.err);return}
  D.subs=r.subs;
  if(r.gr) D.gr = r.gr;
  show();
}
function go2(t){tab=t;if(t==='gs'&&API_URL)refresh();else if(t==='gc')gcLoad();else show()}

let _t;
function push(){if(!API_URL||!S||S.done||mode!=='hs')return;clearTimeout(_t);_t=setTimeout(()=>api('save',{sbd:S.sbd,subject:currentSub,token:S.token,ans:S.ans,viol:S.viol,qi:S.qi}),2500)}

async function enter(){
  const sbd=document.getElementById('sb').value.trim(), pass=document.getElementById('sp').value.trim();
  if(!sbd) return;
  const r=await api('login',{sbd,pass,subject:currentSub});
  if(!r.ok){alert(r.err);return}
  D.imgs=Object.assign(D.imgs||{},r.imgs||{});
  S={sbd,name:r.name,code:r.code,cd:r.cd,ans:r.ans||{},flag:{},viol:r.viol||0,start:r.start,endAt:r.endAt,off:r.now-Date.now(),done:r.done,qi:r.qi||0,token:r.token,g:r.g,title:r.title};
  S.done?result():exam();
}

const cls=t=>String(t||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
function fin3(a,b,c,t){if(c!=null)return{f:c,st:'Vòng 3'};if(a==null||b==null)return{f:null,st:'Chờ chấm'};return Math.abs(a-b)>t?{f:null,st:'Lệch > '+t}:{f:(a+b)/2,st:'Đạt'}}
const gsc=(sbd,no,rd)=>{const x=D.grades[sbd+'|'+no+'|'+rd];return x?x.score:null};
const rpcG=async(a,p)=>api(a,p);

async function gcLoad(){
  const r = await api('stats', {key: AK()});
  if(!r.ok){alert(r.err);return;}
  D.gr = r.gr || [];
  D.cfg.emax = r.emax ?? D.cfg.emax;
  D.cfg.thr = r.thr ?? D.cfg.thr;
  OV = (await rpcG('g_over', {key: AK()})).rows || [];
  show();
}

async function setV3(sbd,no,v){const r=await rpcG('g_final',{key:AK(),sbd,no,score:+v});if(!r.ok)alert(r.err);gcLoad()}
async function gcfgSave(){
  const r=await api('g_cfg',{key:AK(),gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr}});
  alert(r.ok?'Lưu cấu hình chấm thành công.':r.err);
}

function gcTab(){
 const c=D.cfg,n3=OV.filter(o=>/^Lệch/.test(o.st)).length,v=OV.filter(o=>ONL?/^Lệch|^Vòng 3/.test(o.st):true);
 return `<div class="c"><h2>Cấu hình chấm tự luận môn ${currentSub}</h2>
 <div class="g">
   <label class="sm">Điểm tối đa mỗi câu<br><input type="number" step="0.25" value="${c.emax}" onchange="D.cfg.emax=+this.value;save()"></label>
   <label class="sm">Ngưỡng lệch cần vòng 3<br><input type="number" step="0.25" value="${c.thr}" onchange="D.cfg.thr=+this.value;save()"></label>
 </div>
 <div class="tw" style="margin-top:10px"><table><tr><th>Họ tên Giám khảo</th><th>Tài khoản</th><th>Mật khẩu / PIN</th><th>Vòng</th><th>Lớp phụ trách</th><th></th></tr>
 ${D.gr.map((g,i)=>`<tr>
   <td><input value="${esc(g.name)}" onchange="D.gr[${i}].name=this.value;save()"></td>
   <td><input value="${esc(g.user||g.name)}" onchange="D.gr[${i}].user=this.value;save()"></td>
   <td><input type="password" size="10" value="${esc(g.pin)}" onchange="D.gr[${i}].pin=this.value;save()"></td>
   <td><select onchange="D.gr[${i}].round=+this.value;save();show()"><option ${g.round==1?'selected':''}>1</option><option ${g.round==2?'selected':''}>2</option></select></td>
   <td><input value="${esc(g.classes)}" placeholder="12A1,12A2" onchange="D.gr[${i}].classes=this.value;save();show()"></td>
   <td><button onclick="D.gr.splice(${i},1);save();show()">Xóa</button></td>
 </tr>`).join('')}</table></div>
 <p><button onclick="D.gr.push({name:'',user:'',pin:String(Math.floor(1000+Math.random()*9000)),round:1,classes:''});save();show()">+ Thêm giám khảo</button> ${API_URL?'<button class="p" onclick="gcfgSave()">Lưu cấu hình chấm</button>':''}</p>
 </div>
 <div class="c"><h2>Tổng hợp hai vòng chấm (Môn ${currentSub})</h2>
 <p><button onclick="gcLoad()">Làm mới bảng chấm</button> <label class="sm"><input type="checkbox" ${ONL?'checked':''} onchange="ONL=this.checked;show()"> Chỉ hiện bài lệch/vòng 3</label> <span class="bd w">${n3} câu cần vòng 3</span></p>
 <div class="tw"><table><tr><th>Lớp</th><th>SBD · Họ tên</th><th>Câu</th><th>Vòng 1</th><th>Vòng 2</th><th>Lệch</th><th>Vòng 3</th><th>Điểm câu</th><th>Trạng thái</th></tr>
 ${v.map(o=>`<tr><td>${esc(o.lop)}</td><td>${esc(o.sbd)} · ${esc(o.name)}</td><td>${o.no}</td><td>${o.v1??''}</td><td>${o.v2??''}</td><td>${o.v1!=null&&o.v2!=null?Math.abs(o.v1-o.v2).toFixed(2):''}</td><td><input type="number" step="0.25" style="width:70px" value="${o.v3??''}" onchange="setV3('${esc(o.sbd)}',${o.no},this.value)"></td><td>${o.f!=null?+o.f.toFixed(2):''}</td><td>${esc(o.st)}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Chưa có bài tự luận nào cần tổng hợp.</td></tr>'}
 </table></div></div>`;
}

function gvView(){
  GV?gvMain():document.getElementById('app').innerHTML=`
    <div class="c" style="max-width:420px;margin:30px auto">
      <h2>Giám khảo chấm tự luận môn ${currentSub}</h2>
      <label class="sm">Tài khoản / Mã giám khảo<br><input id="gu" placeholder="Nhập tài khoản..." style="width:100%"></label>
      <label class="sm" style="margin-top:8px;display:block">Mật khẩu / Mã PIN<br><input id="gp" type="password" placeholder="Nhập mật khẩu..." style="width:100%"></label>
      <p style="margin-top:14px"><button class="p" onclick="gvIn()">Đăng nhập chấm bài</button></p>
    </div>`;
}

async function gvIn(){
  const user=document.getElementById('gu').value.trim(), pin=document.getElementById('gp').value.trim();
  const r=await rpcG('g_login',{user,pin});
  if(!r.ok){alert(r.err);return}
  const l=await rpcG('g_list',{user,pin});
  D.imgs=Object.assign(D.imgs||{},l.imgs||{});
  GV={user,pin,...r,tasks:l.tasks||[],i:0};
  gvMain();
}

async function gvReload(){const l=await rpcG('g_list',{user:GV.user,pin:GV.pin});if(l.ok){D.imgs=Object.assign(D.imgs||{},l.imgs||{});GV.tasks=l.tasks;GV.i=Math.min(GV.i,Math.max(0,l.tasks.length-1))}gvMain()}

function gvMain(){
 const T=GV.tasks,t=T[GV.i],dn=T.filter(x=>x.items.every(i=>i.mine)).length,hd=`<div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>${esc(GV.name)}</b> · Vòng ${GV.round} (Môn ${currentSub})<div class="sm mu">Lớp phụ trách: ${esc(GV.classes)} · Đã chấm ${dn}/${T.length} bài</div></div><button onclick="gvReload()">Tải lại</button><button onclick="GV=null;gvView()">Thoát</button></div>`;
 if(!t){document.getElementById('app').innerHTML=hd+'<div class="c mu">Chưa có bài tự luận nào được nộp thuộc lớp bạn phụ trách.</div>';return}
 document.getElementById('app').innerHTML=hd+`<div class="ex"><div>${t.items.map((it,k)=>`<div class="c"><div class="sm mu">Bài ${GV.i+1} · Câu tự luận số ${it.no}</div><p style="white-space:pre-wrap"><b>${ER(it.stem)}</b></p><details><summary class="sm">Hướng dẫn chấm</summary><pre class="sm">${esc(it.sol||'(chưa có)')}</pre></details><div class="al" style="background:var(--bg);color:var(--tx)"><pre>${esc(it.ans||'(thí sinh bỏ trống)')}</pre></div><div class="tr"><span>Điểm (0 đến ${GV.emax}):</span><input id="sc${k}" type="number" min="0" max="${GV.emax}" step="0.25" value="${it.mine?it.mine.score:''}" style="width:90px"></div><input id="nt${k}" placeholder="Nhận xét (không bắt buộc)" value="${esc(it.mine?it.mine.note||'':'')}" style="width:100%;margin-top:6px"></div>`).join('')}
 <p><button onclick="GV.i--;gvMain()" ${GV.i?'':'disabled'}>← Bài trước</button> <button class="p" onclick="gvSave()">Lưu và bài sau →</button></p></div>
 <div class="c"><b class="sm">Danh sách bài</b><div class="pl" style="margin-top:8px">${T.map((x,i)=>`<button class="${x.items.every(z=>z.mine)?'d':''} ${i===GV.i?'u':''}" onclick="GV.i=${i};gvMain()">${i+1}</button>`).join('')}</div></div></div>`;
}

async function gvSave(){const t=GV.tasks[GV.i],b=t.items.map((it,k)=>({it,s:document.getElementById('sc'+k).value,n:document.getElementById('nt'+k).value}));
 if(b.some(x=>x.s===''||+x.s<0||+x.s>GV.emax)){alert(`Nhập điểm từ 0 đến ${GV.emax} cho mọi câu.`);return}
 const rs=await Promise.all(b.map(x=>rpcG('g_save',{user:GV.user,pin:GV.pin,sbd:t.id,no:x.it.no,score:+x.s,note:x.n}))),bad=rs.find(r=>!r.ok);if(bad){alert(bad.err);return}
 b.forEach(x=>x.it.mine={score:+x.s,note:x.n});if(GV.i<GV.tasks.length-1)GV.i++;gvMain()}

function role(r){mode=r;show()}
function show(){
  document.getElementById('r1').className=mode==='ad'?'on':'';document.getElementById('r2').className=mode==='hs'?'on':'';document.getElementById('r3').className=mode==='gv'?'on':'';
  document.getElementById('subSelectorBox').style.display = (mode==='hs' && S && !S.done) ? 'none' : 'inline-flex';
  clearInterval(T);
  mode==='ad'?admin():mode==='gv'?gvView():(S&&!S.done?exam():login());
}

async function syncSheetReport(){
  const r = await api('sync_results', {key: AK()});
  if(r.ok){
    alert(`Đã đồng bộ thành công kết quả thi của ${r.count} thí sinh ra sheet KET_QUA_MAU!`);
  }else{
    alert(r.err || 'Lỗi đồng bộ báo cáo.');
  }
}

function getMatrixData(){
  let matrix = {};
  let totals = {mc:0, tf:0, sa:0, essay:0, all:0};
  
  D.bank.forEach(q=>{
    let tag = q.tag && q.tag.trim() !== '' ? q.tag.trim() : 'Chủ đề chung';
    let lvl = q.level || 'NB';
    let type = q.type || 'mc';
    if(!matrix[tag]) matrix[tag] = {NB:{mc:0,tf:0,sa:0,essay:0},TH:{mc:0,tf:0,sa:0,essay:0},VD:{mc:0,tf:0,sa:0,essay:0},VDC:{mc:0,tf:0,sa:0,essay:0}};
    if(matrix[tag][lvl] && matrix[tag][lvl][type] !== undefined) matrix[tag][lvl][type]++;
    
    totals[type]++;
    totals.all++;
  });
  return {matrix, totals};
}

function exportMatrixExcel(){
  if(!D.bank || D.bank.length === 0){ alert('Ngân hàng đề trống!'); return; }
  let {matrix, totals} = getMatrixData();
  
  let rowsData = [
    ["MA TRẬN ĐẶC TẢ ĐỀ THI MÔN " + currentSub.toUpperCase()],
    [],

function ommlToLatex(node){
  const kids = Array.from(node.children || []);
  const find = (name) => kids.find(x => x.localName === name);
  const body = (x) => x ? Array.from(x.children || []).map(ommlToLatex).join('') : '';
  const val = (x) => x ? (x.getAttribute('val') || x.getAttribute('m:val') || '') : '';
  const prop = (parent, name) => parent ? Array.from(parent.children || []).find(x => x.localName === name) : null;
  const tag = node.localName;
  if(tag === 't') return node.textContent || '';
  if(tag.endsWith('Pr') || tag === 'ctrlPr') return '';
  if(tag === 'f'){
    return `\\frac{${body(find('num'))}}{${body(find('den'))}}`;
  }
  if(tag === 'sSup') return `{${body(find('e'))}}^{${body(find('sup'))}}`;
  if(tag === 'sSub') return `{${body(find('e'))}}_{${body(find('sub'))}}`;
  if(tag === 'sSubSup') return `{${body(find('e'))}}_{${body(find('sub'))}}^{${body(find('sup'))}}`;
  if(tag === 'rad'){
    const degree = body(find('deg'));
    const expr = body(find('e'));
    return degree ? `\\sqrt[${degree}]{${expr}}` : `\\sqrt{${expr}}`;
  }
  if(tag === 'd'){
    const pr = find('dPr');
    const begNode = prop(pr, 'begChr'), endNode = prop(pr, 'endChr');
    const beg = begNode ? val(begNode) : '(';
    const end = endNode ? val(endNode) : ')';
    return `\\left${beg || '('}${body(find('e'))}\\right${end || ')'}`;
  }
  if(tag === 'nary'){
    const pr = find('naryPr');
    const chrNode = prop(pr, 'chr');
    const chr = chrNode ? val(chrNode) : '∫';
    const op = ({'∫':'\\int','∬':'\\iint','∭':'\\iiint','∑':'\\sum','∏':'\\prod'}[chr] || chr);
    const sub = body(find('sub')), sup = body(find('sup')), expr = body(find('e'));
    return `${op}${sub ? `_{${sub}}` : ''}${sup ? `^{${sup}}` : ''}${expr}`;
  }
  if(tag === 'func') return `${body(find('fName'))}\\left(${body(find('e'))}\\right)`;
  if(tag === 'bar') return `\\overline{${body(find('e'))}}`;
  if(tag === 'acc') {
    const pr = find('accPr');
    const chrNode = prop(pr, 'chr');
    const chr = chrNode ? val(chrNode) : '^';
    return `${({'̂':'\\hat','̃':'\\tilde','̅':'\\bar'}[chr] || '\\hat')}{${body(find('e'))}}`;
  }
  if(tag === 'oMath' || tag === 'oMathPara' || tag === 'e' || tag === 'num' || tag === 'den' || tag === 'r')
    return kids.map(ommlToLatex).join('');
  return kids.map(ommlToLatex).join('');
}

async function importFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.name.endsWith('.json')){
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.bank){ D.bank = d.bank; if(d.cfg) D.cfg = Object.assign(D.cfg, d.cfg); save(); show(); alert('Nhập dữ liệu thành công!'); }
      } catch(err){ alert('File JSON không hợp lệ.'); }
    };
    reader.readAsText(file);
    return;
  }
  if(file.name.endsWith('.docx')){
    try {
      const zip = new JSZip();
      const zipContent = await zip.loadAsync(file);
      
      D.imgs = {};
      const imageFiles = Object.keys(zipContent.files).filter(filename => filename.startsWith('word/media/'));
      for(let imgPath of imageFiles){
        let imgData = await zipContent.file(imgPath).async("base64");
        let ext = imgPath.split('.').pop().toLowerCase();
        let mime = ext === 'png' ? 'image/png' : (ext === 'gif' ? 'image/gif' : 'image/jpeg');
        let imgId = imgPath.split('/').pop().split('.')[0];
        D.imgs[imgId] = `data:${mime};base64,${imgData}`;
      }

      const xmlDoc = await zipContent.file("word/document.xml").async("string");
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlDoc, "text/xml");
      const paragraphs = xml.getElementsByTagName("w:p");

      const imageRelMap = {};
      const relFile = zipContent.file("word/_rels/document.xml.rels");
      if(relFile){
        const relXml = parser.parseFromString(await relFile.async("string"), "text/xml");
        Array.from(relXml.getElementsByTagName("Relationship")).forEach(rel=>{
          const target = rel.getAttribute("Target") || "";
          if(target.includes("media/")){
            const base = target.split('/').pop().replace(/\.[^.]+$/,'');
            imageRelMap[rel.getAttribute("Id")] = base;
          }
        });
      }
      const relNs = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
      const wordNs = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
      const mathNs = "http://schemas.openxmlformats.org/officeDocument/2006/math";

      function extractDocNode(node){
        if(node.nodeType !== 1) return "";
        const ns = node.namespaceURI || "";
        const name = node.localName;
        if(ns === mathNs && name === "oMath") return `$${ommlToLatex(node)}$`;
        // Giữ lại định dạng gạch chân của từng run Word để nhận diện đáp án.
        if(ns === wordNs && name === "r"){
          const rPr = Array.from(node.children || []).find(x => x.namespaceURI === wordNs && x.localName === "rPr");
          const u = rPr ? Array.from(rPr.children || []).find(x => x.namespaceURI === wordNs && x.localName === "u") : null;
          const uVal = u ? (u.getAttributeNS(wordNs, "val") || u.getAttribute("w:val") || "single") : "none";
          const content = Array.from(node.childNodes || []).filter(x => !(x.nodeType === 1 && x.namespaceURI === wordNs && x.localName === "rPr")).map(extractDocNode).join("");
          return u && !["none", "0", "false"].includes(String(uVal).toLowerCase()) ? `⟪U⟫${content}⟪/U⟫` : content;
        }
        if(ns === wordNs && name === "t") return node.textContent || "";
        if(ns === wordNs && name === "tab") return " ";
        if(ns === wordNs && name === "br") return " ";
        if(name === "blip"){
          const rid = node.getAttributeNS(relNs, "embed") || node.getAttribute("r:embed");
          const imgId = imageRelMap[rid];
          return imgId && D.imgs[imgId] ? ` ⟪IMG:${imgId}⟫ ` : " [HÌNH MINH HỌA] ";
        }
        return Array.from(node.childNodes || []).map(extractDocNode).join("");
      }

      let structuredLines = [];
      for(let p of paragraphs){
        const paraFormatted = Array.from(p.childNodes || []).map(extractDocNode).join("");
        if(paraFormatted.trim()) structuredLines.push(paraFormatted.trim());
      }

      parseTextToBank(structuredLines.join('\n'));
    } catch(err){
      alert('Không thể đọc file Word này: ' + err.message);
    }
  }
}

function parseAnswerTF_(raw){
  const out = [null,null,null,null];
  const pairs = raw.split(/[;|]/).map(x=>x.trim()).filter(Boolean);
  pairs.forEach((part, pos)=>{
    let m = part.match(/^([a-d])\s*[:=.)-]?\s*(đúng|sai|đ|s|true|false|t|f)$/i);
    let idx = m ? 'abcd'.indexOf(m[1].toLowerCase()) : pos;
    let val = m ? m[2] : part;
    if(idx < 0 || idx > 3) return;
    val = String(val).trim().toLowerCase();
    if(['đ','đúng','d','true','t'].includes(val)) out[idx] = true;
    else if(['s','sai','false','f'].includes(val)) out[idx] = false;
  });
  return out;
}

function validateBankForPublish(bank){
  const errors=[];
  (bank||[]).forEach((q,i)=>{
    const label=`Câu ${q.no||i+1}`;
    if(!String(q.stem||'').trim()) errors.push(`${label}: thiếu nội dung câu hỏi.`);
    if(q.type==='mc'){
      ['A','B','C','D'].forEach(k=>{if(!String(q.opt?.[k]||'').trim()) errors.push(`${label}: thiếu phương án ${k}.`)});
      const key=String(q.key||(Array.isArray(q.ans)?q.ans[0]:'')||'').trim().toUpperCase();
      if(!/^[ABCD]$/.test(key)) errors.push(`${label}: cần gạch chân đúng một nhãn A/B/C/D hoặc khai báo [DAPAN].`);
    }else if(q.type==='tf'){
      if(!Array.isArray(q.st)||q.st.length!==4||q.st.some(x=>!String(x.t||'').trim())) errors.push(`${label}: phải có đủ nội dung 4 ý a, b, c, d.`);
      const keys=Array.isArray(q.keys)&&q.keys.length?q.keys:(q.st||[]).map(x=>x.ok);
      if(keys.length!==4||keys.some(v=>v!==true&&v!==false)) errors.push(`${label}: cần gạch chân từ Đúng/Sai ở từng ý a, b, c, d hoặc khai báo [DAPAN] đủ 4 ý.`);
    }else if(q.type==='sa'){
      if(!Array.isArray(q.ans)||!q.ans.some(v=>String(v).trim())) errors.push(`${label}: thiếu đáp án trả lời ngắn (Trả lời: [[...]] hoặc [DAPAN]).`);
    }else if(q.type!=='essay') errors.push(`${label}: dạng câu hỏi không hợp lệ.`);
  });
  return errors;
}

function parseTextToBank(txt){
  const rawLines=String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const bank=[]; let cur=null, currentTag='CHỦ ĐỀ CHUNG', defaultType='mc';
  const markedSegments = line => [...String(line||'').matchAll(/⟪U⟫([\s\S]*?)⟪\/U⟫/g)].map(m=>m[1].trim()).filter(Boolean);
  const cleanMarks = line => String(line||'').replace(/⟪U⟫([\s\S]*?)⟪\/U⟫/g,'$1');
  const finish=()=>{if(cur){
    if(cur.type==='tf' && !cur.keysExplicit && cur.st.every(x=>x.ok===true || x.ok===false)) cur.keys=cur.st.map(x=>x.ok);
    bank.push(cur);cur=null;
  }};
  rawLines.forEach(rawLine=>{
    const marked=markedSegments(rawLine);
    const l=cleanMarks(rawLine).trim();
    if(/^PHẦN\s*1\b/i.test(l)||/trắc nghiệm nhiều lựa chọn/i.test(l)){defaultType='mc';return;}
    if(/^PHẦN\s*2\b/i.test(l)||/trắc nghiệm đúng\s*\/\s*sai/i.test(l)){defaultType='tf';return;}
    if(/^PHẦN\s*3\b/i.test(l)||/trắc nghiệm trả lời ngắn/i.test(l)){defaultType='sa';return;}
    if(/^PHẦN\s*4\b/i.test(l)||/^tự luận/i.test(l)){defaultType='essay';return;}
    if(/^CHỦ\s*ĐỀ\s*[:\-–]/i.test(l)||/^TAG\s*[:\-–]/i.test(l)){
      currentTag=l.replace(/^(?:CHỦ\s*ĐỀ|TAG)\s*[:\-–]\s*/i,'').trim()||currentTag;return;
    }
    if(/^(?:CÂU|BÀI|Q)\s*\d+\s*[.):]/i.test(l)){
      finish();
      let stem=l.replace(/^(?:CÂU|BÀI|Q)\s*\d+\s*[.):]\s*/i,'').trim();
      const lm=stem.match(/\[(NB|TH|VD|VDC)\]/i), level=lm?lm[1].toUpperCase():'NB';
      let type=defaultType;
      if(/\[(?:MC)\]/i.test(stem)) type='mc';
      if(/\[(?:TF|ĐS|ĐÚNG\s*\/\s*SAI)\]/i.test(stem)) type='tf';
      if(/\[(?:SA|TLN|TRẢ\s*LỜI\s*NGẮN)\]/i.test(stem)) type='sa';
      if(/\[(?:TL|TỰ\s*LUẬN)\]/i.test(stem)) type='essay';
      stem=stem.replace(/\[(?:NB|TH|VD|VDC|MC|TF|ĐS|ĐÚNG\s*\/\s*SAI|SA|TLN|TRẢ\s*LỜI\s*NGẮN|TL|TỰ\s*LUẬN)\]/gi,'').trim();
      cur={type,level,tag:currentTag,stem,opt:{A:'',B:'',C:'',D:''},st:[
        {k:'a',t:'',lv:'NB',ok:null},{k:'b',t:'',lv:'TH',ok:null},
        {k:'c',t:'',lv:'VD',ok:null},{k:'d',t:'',lv:'VDC',ok:null}
      ],key:'',keyExplicit:false,keys:[],keysExplicit:false,ans:[],sol:'',rubric:''};
      return;
    }
    if(!cur) return;

    let am=l.match(/^\[(?:DAPAN|ĐÁP\s*ÁN)\]\s*(.+)$/i)||l.match(/^(?:ĐÁP\s*ÁN|ĐA|KEY)\s*[:：]\s*(.+)$/i);
    if(am){
      const raw=am[1].trim();
      if(cur.type==='mc'){cur.key=raw.replace(/^(?:đáp\s*án)\s*/i,'').replace(/[.\s]/g,'').toUpperCase();cur.keyExplicit=true;}
      else if(cur.type==='tf'){cur.keys=parseAnswerTF_(raw);cur.keysExplicit=true;}
      else if(cur.type==='sa') cur.ans=raw.split(/\s*\|\|\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean);
      return;
    }
    if(/^\[HDCHAM\]/i.test(l)) {cur.rubric=l.replace(/^\[HDCHAM\]\s*/i,'').trim();return;}
    if(/^\[HDG\]/i.test(l)||/^HDG\s*:/i.test(l)) {cur.sol=l.replace(/^\[HDG\]\s*/i,'').replace(/^HDG\s*:\s*/i,'').trim();return;}
    if(cur.type==='sa'&&/^TRẢ\s*LỜI\s*:/i.test(l)){
      const m=l.match(/\[\[(.*?)\]\]/); const raw=m?m[1]:l.replace(/^TRẢ\s*LỜI\s*:/i,'').trim();
      cur.ans=raw.split(/\s*\|\|\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean);return;
    }
    if(cur.type==='tf'&&/^[a-d]\s*[.)]/i.test(l)){
      const idx='abcd'.indexOf(l[0].toLowerCase());
      let body=l.replace(/^[a-d]\s*[.)]\s*/i,'').replace(/^#/,'').trim();
      const level=body.match(/\[(NB|TH|VD|VDC)\]/i); if(level) cur.st[idx].lv=level[1].toUpperCase();
      body=body.replace(/\[(NB|TH|VD|VDC)\]/ig,'').replace(/^#/,'').trim();
      // QUY ƯỚC ĐÚNG/SAI CỦA THẦY: gạch chân nhãn a)/b)/c)/d) = ý ĐÚNG;
      // nhãn không gạch chân = ý SAI. Không suy luận từ chữ trong nội dung phát biểu.
      // Chỉ nhận diện dấu gạch chân nếu run được gạch chân đúng là nhãn của ý hiện tại.
      const underlinedLabel = marked.some(x => {
        const m = String(x).trim().match(/^([a-d])(?:[.)])?$/i);
        return !!m && 'abcd'.indexOf(m[1].toLowerCase()) === idx;
      });
      cur.st[idx].ok = underlinedLabel;
      cur.st[idx].t=body;return;
    }
    // Tách phương án A-D ở dạng A., A), A:; hỗ trợ nhiều phương án cùng một dòng,
    // kể cả khi Word ghép sát nhãn hoặc ngăn cách bằng dấu |.
    const labelRe=/(^|[\s|])([A-D])[.):]\s*/g;
    const labels=[]; let lmOpt;
    while((lmOpt=labelRe.exec(l))!==null) labels.push({key:lmOpt[2].toUpperCase(), start:lmOpt.index+lmOpt[0].length, matchStart:lmOpt.index});
    if(labels.length){
      labels.forEach((item,i)=>{
        const end=i+1<labels.length ? labels[i+1].matchStart : l.length;
        const value=l.slice(item.start,end).replace(/[\s|]+$/,'').trim();
        if(value) cur.opt[item.key]=value;
      });
      const markedKeys=marked.map(x=>x.match(/^([A-D])(?:[.):])?$/i)).filter(Boolean).map(x=>x[1].toUpperCase());
      if(!cur.keyExplicit){if(markedKeys.length===1) cur.key=markedKeys[0];
      else if(markedKeys.length>1) cur.key='MULTIPLE';}
      return;
    }
    if(cur.sol) cur.sol+='\n'+l;
    else if(cur.rubric) cur.rubric+='\n'+l;
    else cur.stem+='\n'+l;
  });
  finish();
  if(bank.length){
    D.bank=bank.map((q,i)=>({...q,no:i+1}));
    save();show();
    const errors=validateBankForPublish(D.bank);
    alert(`Đã nhập ${bank.length} câu. ${errors.length?`Có ${errors.length} lỗi cần bổ sung đáp án/cấu trúc trước khi sinh mã đề.`:'Cấu trúc đáp án đã hợp lệ.'}`+(errors.length?'\n\n'+errors.slice(0,12).join('\n')+(errors.length>12?'\n…':'' ):'') );
  }else alert('Không tìm thấy cấu trúc câu hỏi phù hợp trong file Word.');
}

function gen(){
  const errors=validateBankForPublish(D.bank);
  if(errors.length){alert('Không thể sinh mã đề. Cần hoàn thiện file Word trước:\n\n'+errors.slice(0,20).join('\n'));return}
  const n = parseInt(document.getElementById('nc').value) || 4;
  const targetCount = D.bank.length > 0 ? D.bank.length : 22;
  
  let codes = [];
  for(let i = 1; i <= n; i++){
    let codeStr = String(100 + i).padStart(4, '0');
    // Giữ thứ tự câu hỏi đúng như ngân hàng để giáo viên dễ đối chiếu.
    // Nếu muốn tạo mã đề đảo thứ tự, sẽ bổ sung thành tùy chọn riêng.
    const orderedQs = JSON.parse(JSON.stringify(D.bank));
    codes.push({
      code: codeStr,
      qs: orderedQs.slice(0, targetCount)
    });
  }
  D.cfg.codes = codes;
  save(); show();
  alert(`Đã sinh thành công ${n} mã đề, mỗi mã đề có đúng ${targetCount} câu hỏi chuẩn theo cấu trúc!`);
}

function login(){
  document.getElementById('app').innerHTML=`
    <div class="c" style="max-width:440px;margin:30px auto">
      <h2>Phòng thi trực tuyến (${currentSub})</h2>
      <label class="sm">Mã học sinh (SBD)<br><input id="sb" placeholder="VD: 10001" style="width:100%"></label>
      <label class="sm" style="margin-top:8px;display:block">Mật khẩu<br><input id="sp" type="password" placeholder="Nhập mật khẩu..." style="width:100%"></label>
      <p style="margin-top:14px"><button class="p" onclick="enter()">Vào phòng thi</button></p>
    </div>`;
}

function exam(){
  const cd=S.cd, q=cd.qs[S.qi], a=S.ans[S.qi]; 
  q.opt = q.opt || {A:'', B:'', C:'', D:''};
  let b='';

  if(q.type==='mc') {
    b = ['A','B','C','D'].map(k=>q.opt[k] ? `<button class="o ${a===k?'on':''}" onclick="ans('${k}')"><b>${k}.</b> ${ER(q.opt[k])}</button>` : '').join('');
    if(!b) b = '<p class="mu">Chưa có phương án trắc nghiệm.</p>';
  }
  if(q.type==='tf') {
    b = (q.st||[{k:'a',t:'Phát biểu a'},{k:'b',t:'Phát biểu b'},{k:'c',t:'Phát biểu c'},{k:'d',t:'Phát biểu d'}]).map((o,k)=>`
      <div class="tr">
        <span><b>${'abcd'[k]})</b> ${ER(o.t)}</span>
        <button class="${a && a[k]===true?'on':''}" onclick="tf(${k},true)">Đúng</button>
        <button class="${a && a[k]===false?'on':''}" onclick="tf(${k},false)">Sai</button>
      </div>`).join('');
  }
  if(q.type==='sa') {
    b = `<input value="${esc(a||'')}" placeholder="Nhập câu trả lời ngắn..." oninput="ans(this.value,1)" style="width:100%;max-width:320px;margin-top:10px">`;
  }
  if(q.type==='essay') {
    b = `<textarea style="min-height:160px;margin-top:10px" oninput="ans(this.value,1)" placeholder="Trình bày chi tiết lời giải tự luận...">${esc(a||'')}</textarea>`;
  }

  const pl = cd.qs.map((x,i)=>{
    const v = S.ans[i];
    const done = Array.isArray(v) ? v.some(z=>z!=null) : (v!==undefined && v!=='');
    return `<button class="${done?'d':''} ${S.flag?.[i]?'f':''} ${i===S.qi?'u':''}" onclick="S.qi=${i};save();exam()">${i+1}</button>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="flex:1"><b>${esc(S.title||'Bài thi')} · Môn ${currentSub}</b> · Mã đề ${S.code}<div class="sm mu">${esc(S.name)} · SBD ${esc(S.sbd)}</div></div>
      <div id="tm">--:--</div>
      <button class="p" onclick="submit()">Nộp bài</button>
    </div>
    <div class="ex">
      <div class="c">
        ${q.pass?`<div class="al sm" style="white-space:pre-wrap;background:var(--bg);color:var(--tx)">${ER(q.pass)}</div>`:''}
        <div class="sm mu">Câu ${S.qi+1}/${cd.qs.length} <span class="bd">${TY[q.type]}</span> ${q.level?`<span class="bd">${LV[q.level]}</span>`:''}</div>
        <p style="white-space:pre-wrap">${ER(q.stem)}</p>
        ${b}
        <p style="margin-top:16px">
          <button onclick="S.qi=Math.max(0,S.qi-1);save();exam()">← Trước</button> 
          <button onclick="S.flag=S.flag||{};S.flag[S.qi]=!S.flag[S.qi];save();exam()">${S.flag?.[S.qi]?'Bỏ đánh dấu':'⚑ Đánh dấu'}</button> 
          <button onclick="S.qi=Math.min(${cd.qs.length-1},S.qi+1);save();exam()">Sau →</button>
        </p>
      </div>
      <div class="c">
        <b class="sm">Bảng câu hỏi</b>
        <div class="pl" style="margin-top:8px">${pl}</div>
        <p class="sm mu">Xanh: đã làm · Vàng: xem lại.</p>
      </div>
    </div>`;

  clearInterval(T); T=setInterval(tick, 500); tick();
}

function ans(v, keep){ S.ans[S.qi] = v; push(); if(!keep) exam(); }
function tf(k, v){ const a = (S.ans[S.qi] || [null,null,null,null]).slice(); a[k] = v; S.ans[S.qi] = a; push(); exam(); }

function tick(){const r=Math.max(0,Math.round(((S.endAt||S.start+D.cfg.min*60000)-(Date.now()+(S.off||0)))/1000)),e=document.getElementById('tm');if(e)e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0&&!S.fin)fin()}
function submit(){if(confirm('Nộp bài thi '+currentSub+'?'))fin()}
async function fin(){if(S.fin)return;S.fin=1;clearInterval(T);
 const r=await api('submit',{sbd:S.sbd,subject:currentSub,token:S.token,ans:S.ans,viol:S.viol});
 if(!r.ok){S.fin=0;alert(r.err);return}
 S.g=r.g;S.done=true;result()}
function result(){const g=S.g||{p:0};document.getElementById('app').innerHTML=`<div class="c" style="max-width:520px;margin:30px auto;text-align:center"><h2>Đã nộp bài môn ${currentSub}!</h2><div style="font-size:2.4rem;font-weight:800;color:var(--pr)">${g.p.toFixed(2)}<span class="mu" style="font-size:1rem"> /10</span></div><button onclick="S=null;login()">Thoát</button></div>`}

const _moObs = new MutationObserver(()=>{ clearTimeout(window._mjTimer); window._mjTimer = setTimeout(()=>{ if(window.renderMathInElement) renderMathInElement(document.getElementById('app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }, 40); });
window.addEventListener('load', ()=>{ _moObs.observe(document.getElementById('app'),{childList:true,subtree:true}); if(window.renderMathInElement) renderMathInElement(document.getElementById('app'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); });

if(/[?&](thi|cham)/.test(location.search)){mode=/[?&]cham/.test(location.search)?'gv':'hs';['#r1','#r2','#r3'].forEach(x=>document.querySelector(x).style.display='none')}
show();
</script></body></html>
