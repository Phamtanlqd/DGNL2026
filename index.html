<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống thi ĐGNL Đa Môn - Bảo mật tuyệt đối</title>
<style>
:root{--bg:#f5f6fa;--cd:#fff;--tx:#1b2333;--mu:#667085;--bd:#dfe3ec;--pr:#1d4ed8;--ps:#e3ebff;--ok:#12805c;--er:#c0392b;--wa:#b7791f;--ws:#fdf0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--cd:#18202f;--tx:#e8ecf5;--mu:#9aa5ba;--bd:#2b3549;--pr:#6e9bff;--ps:#1d2c52;--ok:#4fd1a1;--er:#ff8b7b;--wa:#f0b955;--ws:#473410;color-scheme:dark}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav b{flex:1;min-width:140px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:1.05rem;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:.85rem}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:9px;padding:7px 12px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.on{background:var(--ps);border-color:var(--pr)}button:disabled{opacity:.5}
input,textarea,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
textarea{width:100%;min-height:80px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}.tw table{font-size:.88rem}th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bd{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--ps);color:var(--pr)}.bd.w{background:var(--ws);color:var(--wa)}
.ex{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}@media(max-width:800px){.ex{grid-template-columns:1fr}}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.pl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pl button{padding:6px 0}.pl .d{background:var(--ps);border-color:var(--pr)}.pl .f{background:var(--ws);border-color:var(--wa)}.pl .u{outline:2px solid var(--pr)}
.tr{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);padding:7px 0}.tr span{flex:1}
pre{white-space:pre-wrap;margin:0;font:inherit}
#tm{font:700 1.2rem ui-monospace,monospace;padding:3px 10px;border-radius:99px;background:var(--ps);color:var(--pr)}
.al{background:var(--ws);color:var(--wa);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.sub-bar{background:var(--ps);padding:6px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head><body>
<div class="nav">
  <b>🎯 Hệ thống thi ĐGNL Đa Môn</b>
  <span id="subSelectorBox" class="sm">Môn: 
    <select id="globalSub" onchange="changeSubject(this.value)">
      <option value="Toan">Toán học</option>
      <option value="Van">Ngữ văn</option>
      <option value="Anh">Tiếng Anh</option>
      <option value="Ly">Vật lý</option>
      <option value="Hoa">Hóa học</option>
      <option value="Sinh">Sinh học</option>
    </select>
  </span>
  <button id="r1" onclick="role('ad')">Quản trị</button>
  <button id="r2" onclick="role('hs')">Thí sinh</button>
  <button id="r3" onclick="role('gv')">Giám khảo</button>
</div>
<div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbz7u3EOWEBxTTsNipd3613Nk0m8WXyg0mYznDQUmgGxwSrN7lMW8nC8Ef1Cw6VihdzyoA/exec';
const LV={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng',VDC:'VD cao'},TY={mc:'Nhiều lựa chọn',tf:'Đúng/Sai',sa:'Trả lời ngắn',essay:'Tự luận'};
const ER=s=>esc(s).replace(/⟪IMG:(\w+)⟫/g,(m,id)=>D.imgs&&D.imgs[id]?`<img src="${D.imgs[id]}" style="max-width:100%;max-height:160px;display:block;margin:6px 0;vertical-align:middle">`:'[hình]');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLE=[
{type:'mc',level:'NB',tag:'Hàm số',stem:'Giá trị nhỏ nhất của $f(x)=x^2-4x+3$ là',opt:{A:'−1',B:'0',C:'1',D:'3'},ans:['A'],sol:'f(x)=(x−2)²−1.'},
{type:'tf',level:'TH',tag:'Hàm số',stem:'Cho $f(x)=x^3-3x$.',st:[{k:'a',t:'$f\'(x)=3x^2-3$.',lv:'NB',ok:true},{k:'b',t:'Hàm số đồng biến trên ℝ.',lv:'TH',ok:false},{k:'c',t:'Cực đại tại $x=-1$.',lv:'TH',ok:true},{k:'d',t:'$f(2)=3$.',lv:'VD',ok:false}],sol:''},
{type:'sa',level:'VD',tag:'Đại số',stem:'Tích các nghiệm của $x^2-7x+10=0$ là',ans:['10'],sol:'Viète.'},
{type:'essay',level:'VD',tag:'Xác suất',stem:'Trình bày suy luận giải bài toán xác suất toàn phần...',sol:'Rubric: lập sơ đồ 0,5; công thức 1,0; kết quả 0,5.'}
];
const ROSTER='10001,Nguyễn Văn An,12A1,0101,123456\n10002,Trần Thị Bình,12A1,0102,123456\n10003,Lê Minh Châu,12A2,0103,123456';

let currentSub = 'Toan';
let D = loadSub(currentSub);

function init(sub){return{bank:SAMPLE.map((q,i)=>({...q,no:i+1})),cfg:{name:'Kỳ thi thử '+sub,mon:sub,min:30,n:4,codes:[],emax:2,thr:1},roster:ROSTER,subs:{},gr:[],grades:{},imgs:{}}}
function loadSub(sub){
  try{const d=JSON.parse(localStorage.getItem('dgnl_sub_'+sub));if(d&&d.bank)return d}catch(e){}
  return init(sub);
}
function save(){
  try{localStorage.setItem('dgnl_sub_'+currentSub,JSON.stringify(D))}catch(e){alert('Bộ nhớ trình duyệt đầy.')}
  push();
}

function changeSubject(sub){
  currentSub = sub;
  D = loadSub(sub);
  D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
  const sel = document.getElementById('globalSub'); if(sel) sel.value = sub;
  show();
}

D.gr = D.gr || []; D.grades = D.grades || {}; D.cfg.emax = D.cfg.emax || 2; D.cfg.thr = D.cfg.thr ?? 1; D.imgs = D.imgs || {};
let OV=[],ONL=false,GV=null,S=null,T=null,tab='bank',mode='ad',adminAuthed=false;

async function api(a,p){
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,subject:currentSub,...p})});
    const t=await r.text();
    try{return JSON.parse(t)}catch(e){return{ok:false,err:'Lỗi kết nối máy chủ'}}
  }catch(e){return{ok:false,err:'Không kết nối mạng'}}
}

function AK(){
  return sessionStorage.getItem('ak') || '';
}

async function adminLogin(){
  const pass=document.getElementById('adPass').value.trim();
  if(!pass){alert('Vui lòng nhập mật khẩu quản trị!');return;}
  const r=await api('admin_login',{key:pass});
  if(r.ok){
    sessionStorage.setItem('ak',pass);
    adminAuthed=true;
    show();
  }else{
    alert(r.err||'Mật khẩu Quản trị không chính xác');
  }
}

async function pub(){
  const r=await api('publish',{key:AK(),cfg:D.cfg,codes:D.cfg.codes,roster:D.roster,gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr},imgs:D.imgs});
  alert(r.ok?`Đăng thành công môn ${currentSub} (${r.n} mã đề, ${r.hs} thí sinh)!`:r.err);
}

async function refresh(){
  const r=await api('stats',{key:AK()});
  if(!r.ok){alert(r.err);return}
  D.subs=r.subs;
  if(r.gr) D.gr = r.gr;
  show();
}
function go2(t){tab=t;if(t==='gs'&&API_URL)refresh();else if(t==='gc')gcLoad();else show()}

let _t;
function push(){if(!API_URL||!S||S.done||mode!=='hs')return;clearTimeout(_t);_t=setTimeout(()=>api('save',{sbd:S.sbd,subject:currentSub,token:S.token,ans:S.ans,viol:S.viol,qi:S.qi}),2500)}

async function enter(){
  const sbd=document.getElementById('sb').value.trim(), pass=document.getElementById('sp').value.trim();
  if(!sbd) return;
  const r=await api('login',{sbd,pass,subject:currentSub});
  if(!r.ok){alert(r.err);return}
  D.imgs=Object.assign(D.imgs||{},r.imgs||{});
  S={sbd,name:r.name,code:r.code,cd:r.cd,ans:r.ans||{},flag:{},viol:r.viol||0,start:r.start,endAt:r.endAt,off:r.now-Date.now(),done:r.done,qi:r.qi||0,token:r.token,g:r.g,title:r.title};
  S.done?result():exam();
}

const cls=t=>String(t||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean);
function fin3(a,b,c,t){if(c!=null)return{f:c,st:'Vòng 3'};if(a==null||b==null)return{f:null,st:'Chờ chấm'};return Math.abs(a-b)>t?{f:null,st:'Lệch > '+t}:{f:(a+b)/2,st:'Đạt'}}
const gsc=(sbd,no,rd)=>{const x=D.grades[sbd+'|'+no+'|'+rd];return x?x.score:null};
const rpcG=async(a,p)=>api(a,p);

async function gcLoad(){
  const r = await api('stats', {key: AK()});
  if(!r.ok){alert(r.err);return;}
  D.gr = r.gr || [];
  D.cfg.emax = r.emax ?? D.cfg.emax;
  D.cfg.thr = r.thr ?? D.cfg.thr;
  OV = (await rpcG('g_over', {key: AK()})).rows || [];
  show();
}

async function setV3(sbd,no,v){const r=await rpcG('g_final',{key:AK(),sbd,no,score:+v});if(!r.ok)alert(r.err);gcLoad()}
async function gcfgSave(){
  const r=await api('g_cfg',{key:AK(),gcfg:{emax:D.cfg.emax,thr:D.cfg.thr,gr:D.gr}});
  alert(r.ok?'Lưu cấu hình chấm thành công.':r.err);
}

function gcTab(){
 const c=D.cfg,n3=OV.filter(o=>/^Lệch/.test(o.st)).length,v=OV.filter(o=>ONL?/^Lệch|^Vòng 3/.test(o.st):true);
 return `<div class="c"><h2>Cấu hình chấm tự luận môn ${currentSub}</h2>
 <div class="g">
   <label class="sm">Điểm tối đa mỗi câu<br><input type="number" step="0.25" value="${c.emax}" onchange="D.cfg.emax=+this.value;save()"></label>
   <label class="sm">Ngưỡng lệch cần vòng 3<br><input type="number" step="0.25" value="${c.thr}" onchange="D.cfg.thr=+this.value;save()"></label>
 </div>
 <div class="tw" style="margin-top:10px"><table><tr><th>Họ tên Giám khảo</th><th>Tài khoản</th><th>Mật khẩu / PIN</th><th>Vòng</th><th>Lớp phụ trách</th><th></th></tr>
 ${D.gr.map((g,i)=>`<tr>
   <td><input value="${esc(g.name)}" onchange="D.gr[${i}].name=this.value;save()"></td>
   <td><input value="${esc(g.user||g.name)}" onchange="D.gr[${i}].user=this.value;save()"></td>
   <td><input type="password" size="10" value="${esc(g.pin)}" onchange="D.gr[${i}].pin=this.value;save()"></td>
   <td><select onchange="D.gr[${i}].round=+this.value;save();show()"><option ${g.round==1?'selected':''}>1</option><option${g.round==2?'selected':''}>2</option></select></td>
   <td><input value="${esc(g.classes)}" placeholder="12A1,12A2" onchange="D.gr[${i}].classes=this.value;save();show()"></td>
   <td><button onclick="D.gr.splice(${i},1);save();show()">Xóa</button></td>
 </tr>`).join('')}</table></div>
 <p><button onclick="D.gr.push({name:'',user:'',pin:String(Math.floor(1000+Math.random()*9000)),round:1,classes:''});save();show()">+ Thêm giám khảo</button> ${API_URL?'<button class="p" onclick="gcfgSave()">Lưu cấu hình chấm</button>':''}</p>
 </div>
 <div class="c"><h2>Tổng hợp hai vòng chấm (Môn ${currentSub})</h2>
 <p><button onclick="gcLoad()">Làm mới bảng chấm</button> <label class="sm"><input type="checkbox" ${ONL?'checked':''} onchange="ONL=this.checked;show()"> Chỉ hiện bài lệch/vòng 3</label> <span class="bd w">${n3} câu cần vòng 3</span></p>
 <div class="tw"><table><tr><th>Lớp</th><th>SBD · Họ tên</th><th>Câu</th><th>Vòng 1</th><th>Vòng 2</th><th>Lệch</th><th>Vòng 3</th><th>Điểm câu</th><th>Trạng thái</th></tr>
 ${v.map(o=>`<tr><td>${esc(o.lop)}</td><td>${esc(o.sbd)} ·${esc(o.name)}</td><td>${o.no}</td><td>${o.v1??''}</td><td>${o.v2??''}</td><td>${o.v1!=null&&o.v2!=null?Math.abs(o.v1-o.v2).toFixed(2):''}</td><td><input type="number" step="0.25" style="width:70px" value="${o.v3??''}" onchange="setV3('${esc(o.sbd)}',${o.no},this.value)"></td><td>${o.f!=null?+o.f.toFixed(2):''}</td><td>${esc(o.st)}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Chưa có bài tự luận nào cần tổng hợp.</td></tr>'}
 </table></div></div>`;
}

function gvView(){
  GV?gvMain():document.getElementById('app').innerHTML=`
    <div class="c" style="max-width:420px;margin:30px auto">
      <h2>Giám khảo chấm tự luận môn ${currentSub}</h2>
      <label class="sm">Tài khoản / Mã giám khảo<br><input id="gu" placeholder="Nhập tài khoản..." style="width:100%"></label>
      <label class="sm" style="margin-top:8px;display:block">Mật khẩu / Mã PIN<br><input id="gp" type="password" placeholder="Nhập mật khẩu..." style="width:100%"></label>
      <p style="margin-top:14px"><button class="p" onclick="gvIn()">Đăng nhập chấm bài</button></p>
    </div>`;
}

async function gvIn(){
  const user=document.getElementById('gu').value.trim(), pin=document.getElementById('gp').value.trim();
  const r=await rpcG('g_login',{user,pin});
  if(!r.ok){alert(r.err);return}
  const l=await rpcG('g_list',{user,pin});
  D.imgs=Object.assign(D.imgs||{},l.imgs||{});
  GV={user,pin,...r,tasks:l.tasks||[],i:0};
  gvMain();
}

async function gvReload(){const l=await rpcG('g_list',{user:GV.user,pin:GV.pin});if(l.ok){D.imgs=Object.assign(D.imgs||{},l.imgs||{});GV.tasks=l.tasks;GV.i=Math.min(GV.i,Math.max(0,l.tasks.length-1))}gvMain()}

function gvMain(){
 const T=GV.tasks,t=T[GV.i],dn=T.filter(x=>x.items.every(i=>i.mine)).length,hd=`<div class="c" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1"><b>${esc(GV.name)}</b> · Vòng ${GV.round} (Môn ${currentSub})<div class="sm mu">Lớp phụ trách: ${esc(GV.classes)} · Đã chấm ${dn}/${T.length} bài</div></div><button onclick="gvReload()">Tải lại</button><button onclick="GV=null;gvView()">Thoát</button></div>`;
 if(!t){document.getElementById('app').innerHTML=hd+'<div class="c mu">Chưa có bài tự luận nào được nộp thuộc lớp bạn phụ trách.</div>';return}
 document.getElementById('app').innerHTML=hd+`<div class="ex"><div>${t.items.map((it,k)=>`<div class="c"><div class="sm mu">Bài ${GV.i+1} · Câu tự luận số ${it.no}</div><p style="white-space:pre-wrap"><b>${ER(it.stem)}</b></p><details><summary class="sm">Hướng dẫn chấm</summary><pre class="sm">${esc(it.sol||'(chưa có)')}</pre></details><div class="al" style="background:var(--bg);color:var(--tx)"><pre>${esc(it.ans||'(thí sinh bỏ trống)')}</pre></div><div class="tr"><span>Điểm (0 đến ${GV.emax}):</span><input id="sc${k}" type="number" min="0" max="${GV.emax}" step="0.25" value="${it.mine?it.mine.score:''}" style="width:90px"></div><input id="nt${k}" placeholder="Nhận xét (không bắt buộc)" value="${esc(it.mine?it.mine.note||'':'')}" style="width:100%;margin-top:6px"></div>`).join('')}
 <p><button onclick="GV.i--;gvMain()" ${GV.i?'':'disabled'}>← Bài trước</button> <button class="p" onclick="gvSave()">Lưu và bài sau →</button></p></div>
 <div class="c"><b class="sm">Danh sách bài</b><div class="pl" style="margin-top:8px">${T.map((x,i)=>`<button class="${x.items.every(z=>z.mine)?'d':''}${i===GV.i?'u':''}" onclick="GV.i=${i};gvMain()">${i+1}</button>`).join('')}</div></div></div>`;
}

async function gvSave(){const t=GV.tasks[GV.i],b=t.items.map((it,k)=>({it,s:document.getElementById('sc'+k).value,n:document.getElementById('nt'+k).value}));
 if(b.some(x=>x.s===''||+x.s<0||+x.s>GV.emax)){alert(`Nhập điểm từ 0 đến ${GV.emax} cho mọi câu.`);return}
 const rs=await Promise.all(b.map(x=>rpcG('g_save',{user:GV.user,pin:GV.pin,sbd:t.id,no:x.it.no,score:+x.s,note:x.n}))),bad=rs.find(r=>!r.ok);if(bad){alert(bad.err);return}
 b.forEach(x=>x.it.mine={score:+x.s,note:x.n});if(GV.i<GV.tasks.length-1)GV.i++;gvMain()}

function role(r){mode=r;show()}
function show(){
  document.getElementById('r1').className=mode==='ad'?'on':'';document.getElementById('r2').className=mode==='hs'?'on':'';document.getElementById('r3').className=mode==='gv'?'on':'';
  document.getElementById('subSelectorBox').style.display = (mode==='hs' && S && !S.done) ? 'none' : 'inline-flex';
  clearInterval(T);
  mode==='ad'?admin():mode==='gv'?gvView():(S&&!S.done?exam():login());
}

async function syncSheetReport(){
  const r = await api('sync_results', {key: AK()});
  if(r.ok){
    alert(`Đã đồng bộ thành công kết quả thi của ${r.count} thí sinh ra sheet KET_QUA_MAU!`);
  }else{
    alert(r.err || 'Lỗi đồng bộ báo cáo.');
  }
}

function admin(){
  try{
    if(!adminAuthed && sessionStorage.getItem('ak')){
      adminAuthed=true;
    }
    if(!adminAuthed){
      document.getElementById('app').innerHTML=`
        <div class="c" style="max-width:420px;margin:30px auto">
          <h2>Đăng nhập Quản trị viên (${currentSub})</h2>
          <label class="sm">Mật khẩu Quản trị<br><input id="adPass" type="password" style="width:100%" placeholder="Nhập mật khẩu quản trị..."></label>
          <p style="margin-top:14px"><button class="p" onclick="adminLogin()">Đăng nhập Quản trị</button></p>
        </div>`;
      return;
    }
    const tabs=[['bank','1. Ngân hàng đề'],['cd','2. Mã đề & Đăng mạng'],['gs','3. Giám sát & Kết quả'],['gc','4. Phân quyền & Chấm tự luận']];
    let h=`<div class="c" style="display:flex;gap:6px;flex-wrap:wrap"><div class="sub-bar"><b>Môn quản lý:</b> <span style="color:var(--pr);font-weight:bold">${currentSub}</span></div><button style="margin-left:auto;background:var(--er);color:#fff;border-color:var(--er)" onclick="sessionStorage.removeItem('ak');adminAuthed=false;show()">Đăng xuất Quản trị</button></div>

function rows(){
  return String(D.roster||'').split('\n').map(l=>{
    const p=l.split(',').map(x=>x.trim());
    return {sbd:p[0],ten:p[1],lop:p[2],made:p[3],pass:p[4]};
  }).filter(r=>r.sbd);
}

async function importFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.name.endsWith('.json')){
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.bank){ D.bank = d.bank; if(d.cfg) D.cfg = Object.assign(D.cfg, d.cfg); save(); show(); alert('Nhập dữ liệu thành công!'); }
      } catch(err){ alert('File JSON không hợp lệ.'); }
    };
    reader.readAsText(file);
    return;
  }
  if(file.name.endsWith('.docx')){
    try {
      const zip = new JSZip();
      const zipContent = await zip.loadAsync(file);
      
      D.imgs = {};
      const imageFiles = Object.keys(zipContent.files).filter(filename => filename.startsWith('word/media/'));
      for(let imgPath of imageFiles){
        let imgData = await zipContent.file(imgPath).async("base64");
        let ext = imgPath.split('.').pop().toLowerCase();
        let mime = ext === 'png' ? 'image/png' : (ext === 'gif' ? 'image/gif' : 'image/jpeg');
        let imgId = imgPath.split('/').pop().split('.')[0];
        D.imgs[imgId] = `data:${mime};base64,${imgData}`;
      }

      const xmlDoc = await zipContent.file("word/document.xml").async("string");
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlDoc, "text/xml");
      const paragraphs = xml.getElementsByTagName("w:p");
      
      let structuredLines = [];
      for(let p of paragraphs){
        let rElements = p.getElementsByTagName("w:r");
        let paraFormatted = "";
        let imgCounter = 0;
        for(let re of rElements){
          let ts = re.getElementsByTagName("w:t");
          for(let t of ts) paraFormatted += t.textContent;
          
          let blips = re.getElementsByTagName("a:blip");
          if(blips.length > 0){
            let imgKeys = Object.keys(D.imgs);
            if(imgKeys.length > 0){
              let assignedId = imgKeys[imgCounter % imgKeys.length];
              paraFormatted += ` ⟪IMG:${assignedId}⟫ `;
              imgCounter++;
            }
          }
        }
        if(paraFormatted.trim()) structuredLines.push(paraFormatted.trim());
      }

      parseTextToBank(structuredLines.join('\n'));
    } catch(err){
      alert('Không thể đọc file Word này: ' + err.message);
    }
  }
}

function parseTextToBank(txt){
  const rawLines = txt.split('\n').map(l=>l.trim()).filter(Boolean);
  let bank = [], cur = null;
  let currentTag = 'CHỦ ĐỀ CHUNG';
  let defaultType = 'mc';

  rawLines.forEach(l=>{
    if(/phần\s*1/i.test(l) || /dạng\s*trắc\s*nghiệm/i.test(l)){ defaultType = 'mc'; return; }
    if(/phần\s*2/i.test(l) || /đúng\s*sai/i.test(l)){ defaultType = 'tf'; return; }
    if(/phần\s*3/i.test(l) || /trả\s*lời\s*ngắn/i.test(l)){ defaultType = 'sa'; return; }
    if(/phần\s*4/i.test(l) || /tự\s*luận/i.test(l)){ defaultType = 'essay'; return; }

    if(/^CHỦ\s*ĐỀ\s*[:\–\-]/i.test(l) || /^TAG\s*[:\–\-]/i.test(l)){
      let extracted = l.replace(/^CHỦ\s*ĐỀ\s*[:\–\-]/i, '').replace(/^TAG\s*[:\–\-]/i, '').trim();
      if(extracted) currentTag = extracted;
      return;
    }

    if(/^CÂU\s*\d+/i.test(l) || /^Q\s*\d+/i.test(l) || /^(?:Câu|Bài)\s*\d+[\.\:]/i.test(l)){
      if(cur) bank.push(cur);

      let stemText = l.replace(/^(?:CÂU|Bài|Q)\s*\d+\s*[\.\:]\s*/i, '').trim();
      
      let levelMatch = stemText.match(/\[(NB|TH|VD|VDC)\]/i);
      let levelVal = levelMatch ? levelMatch[1].toUpperCase() : 'NB';
      stemText = stemText.replace(/\[(NB|TH|VD|VDC)\]/i, '').trim();

      let typeVal = defaultType;
      if(/\[(?:ĐS|Đúng[\/\s]Sai)\]/i.test(stemText) || /\[TF\]/i.test(stemText)){ typeVal = 'tf'; }
      else if(/\[(?:TLN|Trả lời ngắn)\]/i.test(stemText)){ typeVal = 'sa'; }
      else if(/\[(?:TL|Tự luận)\]/i.test(stemText)){ typeVal = 'essay'; }
      
      stemText = stemText.replace(/\[(ĐS|Đúng[\/\s]Sai|TF|TLN|Trả lời ngắn|TL|Tự luận)\]/gi, '').trim();

      cur = {
        type: typeVal, 
        level: levelVal, 
        tag: currentTag, 
        stem: stemText, 
        opt: {A:'',B:'',C:'',D:''}, 
        st: [
          {k:'a',t:'Phát biểu a',lv:'NB',ok:true},
          {k:'
